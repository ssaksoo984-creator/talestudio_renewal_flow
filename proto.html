<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tale Studio 목업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="src/base.css">
<style>
/* 레이아웃: 위 얇은 막대(지금 노드 · 플로우 보기) → 화면 목업을 크게. 플로우는 오른쪽 서랍 */
html, body { height: 100% }
img { max-width: 100% }
[hidden] { display: none !important }
.pbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line) }
.pbar h1 { font-size: 15px; margin: 0; white-space: nowrap }
.here { display: flex; gap: 6px; align-items: center; min-width: 0; flex: 1 }
.here .id { font-family: var(--mono); font-size: 12px; border: 1px solid var(--hl); color: var(--hl); border-radius: 99px; padding: 1px 8px; white-space: nowrap }
.here .lb { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.here .ty { font-size: 11.5px; color: var(--mut); white-space: nowrap }
.pbar .acts { display: flex; gap: 6px; flex-wrap: wrap }
.btn.on { border-color: var(--hl); color: var(--hl) }
.stagewrap { padding: 16px; display: grid; justify-items: center }
.frame { width: 100%; max-width: 1240px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--w-bg); box-shadow: 0 6px 30px rgb(0 0 0 / .08) }
.frame .screen { min-height: calc(100vh - 120px) }
.drawer { position: fixed; z-index: 30; top: var(--barh, 56px); right: 0; bottom: 0; width: min(600px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -10px 0 40px rgb(0 0 0 / .18); display: grid; grid-template-rows: auto 1fr auto; padding-bottom: env(safe-area-inset-bottom, 0px) }
.drawer-h { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.drawer-h b { font-size: 14px }
.drawer .flow-box { max-height: none; height: 100% }
.drawer-f { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 12px; color: var(--mut); display: grid; gap: 6px }
.drawer-f .next { display: flex; flex-wrap: wrap; gap: 6px }
.lgd { display: inline-flex; align-items: center; gap: 6px }
.lgd i { width: 22px; height: 10px; border-radius: 3px; border: 2.5px solid; border-image: linear-gradient(90deg, var(--hl), var(--hl2), var(--hl)) 1 }
.zoom { display: flex; gap: 4px }
</style>
</head>
<body>
<header class="pbar" id="pbar">
  <h1>Tale Studio 목업</h1>
  <div class="here" aria-live="polite"><span class="id" id="hereId">E1</span><span class="lb" id="hereLabel"></span><span class="ty" id="hereType"></span></div>
  <span class="seg-plan" id="planSeg" aria-label="Writer 안"></span>
  <div class="acts">
    <button class="btn" id="back" disabled>← 이전 화면</button>
    <button class="btn" id="toggleFlow" aria-expanded="false" aria-controls="drawer">플로우 보기</button>
    <button class="btn" id="reset">처음부터</button>
    <a class="btn" id="toIndex" href="index.html">플로우 페이지 ↗</a>
  </div>
</header>

<main class="stagewrap"><div class="frame"><div class="screen" id="screen"></div></div></main>

<aside class="drawer" id="drawer" aria-label="플로우" hidden>
  <div class="drawer-h"><b>플로우 <span class="lgd" style="font-weight:400;font-size:12px;color:var(--mut)"><i></i>지금 화면</span></b>
    <span class="zoom"><button class="btn" id="zout" aria-label="축소">−</button><button class="btn" id="zfit">맞춤</button><button class="btn" id="zin" aria-label="확대">＋</button><button class="btn" id="closeFlow" aria-label="플로우 닫기">닫기 ✕</button></span></div>
  <div class="flow-box" id="flow"><div class="loading">플로우를 그리는 중…</div></div>
  <div class="drawer-f"><span>노드를 누르면 그 화면으로 이동해요. 여기서 갈 수 있는 곳:</span><div class="next" id="nextList"></div></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="src/flow.js"></script>
<script src="src/flowview.js"></script>
<script src="src/screens.js"></script>
<script>
(function () {
  var F = window.FLOW, V = window.FlowView, P = window.PROTO;
  var byId = V.byId, esc = V.esc;
  var $ = function (id) { return document.getElementById(id); };
  var TYPE = { screen: '화면', modal: '팝업 · 확인창', decision: '갈림', ai: 'AI 작업 중', ext: '범위 밖' };
  var trail = [], cur = null, mounted = false;

  function update(id, fromProto) {
    if (!byId[id]) return;
    if (cur && cur !== id) trail.push(cur);
    if (trail.length > 50) trail.shift();
    cur = id;
    if (!fromProto && P.current() !== id) P.show(id);
    var n = byId[id];
    $('hereId').textContent = id;
    $('hereLabel').textContent = n.label;
    $('hereType').textContent = TYPE[n.type] + ' · ' + V.stageName[n.stage];
    $('back').disabled = !trail.length;
    $('toIndex').href = 'index.html#' + id;
    $('nextList').innerHTML = F.edges.filter(function (e) { return e[0] === id; }).map(function (e) {
      return '<button class="btn" data-node="' + e[1] + '">' + (e[2] ? esc(e[2]) + ' → ' : '→ ') + '<span class="mono">' + e[1] + '</span> ' + esc(byId[e[1]].label) + '</button>';
    }).join('') || '<span>없음</span>';
    if (mounted) V.mark(id, !$('drawer').hidden);
    if (history.replaceState) history.replaceState(null, '', '#' + id);
  }
  function openFlow(open) {
    $('drawer').hidden = !open;
    $('toggleFlow').setAttribute('aria-expanded', String(open));
    $('toggleFlow').classList.toggle('on', open);
    $('toggleFlow').textContent = open ? '플로우 닫기' : '플로우 보기';
    if (!open) return;
    if (!mounted) {
      mounted = true;
      V.mount($('flow'), { onSelect: function (id) { update(id); } }).then(function () { V.setZoom(.8); V.mark(cur, true); });
    } else V.mark(cur, true);
  }

  function barH() { document.documentElement.style.setProperty('--barh', $('pbar').getBoundingClientRect().bottom + 'px'); }
  barH(); window.addEventListener('resize', barH);
  var plan = 'A';
  try { plan = localStorage.getItem('tale-plan') === 'B' ? 'B' : 'A'; } catch (e) {}
  function paintPlan() {
    $('planSeg').innerHTML = F.plans.map(function (x) { return '<button data-plan="' + x.id + '" aria-pressed="' + (x.id === plan) + '" title="' + esc(x.text) + '">' + esc(x.name) + '</button>'; }).join('');
  }
  function setPlan(p) {
    plan = p; try { localStorage.setItem('tale-plan', p); } catch (e) {}
    paintPlan(); P.setPlan(p);
    V.setPlan(p).then(function () { if (!V.visible(cur)) update('W1'); else if (mounted) V.mark(cur, !$('drawer').hidden); });
    if (!V.visible(cur)) update('W1');
  }
  paintPlan(); V.setPlan(plan); P.setPlan(plan);
  $('planSeg').addEventListener('click', function (e) { var b = e.target.closest('[data-plan]'); if (b) setPlan(b.dataset.plan); barH(); });

  P.mount($('screen'), { onNavigate: function (id) { update(id, true); } });
  $('toggleFlow').onclick = function () { openFlow($('drawer').hidden); };
  $('closeFlow').onclick = function () { openFlow(false); $('toggleFlow').focus(); };
  $('zin').onclick = V.zoomIn; $('zout').onclick = V.zoomOut; $('zfit').onclick = V.fit;
  $('reset').onclick = function () { P.reset(); trail = []; cur = null; update('E1'); };
  $('back').onclick = function () { var p = trail.pop(); if (!p) return; cur = null; update(p); };
  $('nextList').addEventListener('click', function (e) { var b = e.target.closest('[data-node]'); if (b) update(b.dataset.node); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('drawer').hidden && !document.querySelector('#screen .w-modal')) openFlow(false); });

  var start = location.hash.slice(1);
  update(byId[start] ? start : 'E1');
})();
</script>
</body>
</html>
