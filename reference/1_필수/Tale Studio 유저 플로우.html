/* Tale Studio 토큰(globals.css) 그대로. 다크가 기본, 라이트도 같은 역할로 맞춤 */
:root {
  color-scheme: dark;
  --bg: oklch(0.156 0 0);
  --canvas: oklch(0.156 0 0);
  --fg: oklch(1 0 0);
  --card: oklch(0.185 0 0);
  --accent: oklch(0.222 0 0);
  --muted-fg: oklch(0.762 0 0);
  --border: oklch(0.278 0 0);
  --border-strong: oklch(0.38 0 0);
  --ring: oklch(1 0 0 / 0.5);
  --edge: oklch(0.7 0.06 250);
  --dot: oklch(0.762 0 0 / 0.12);
  --producer: oklch(0.606 0.25 292.717);
  --writer: oklch(0.623 0.214 259.815);
  --warning: oklch(0.779 0.175 64.1);
  --node-shadow: 0 1px 2px oklch(0 0 0 / 0.45);
  --font-sans: "Geist", "Pretendard TS", "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Pretendard TS", monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: oklch(1 0 0);
    --canvas: oklch(0.985 0 0);
    --fg: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --accent: oklch(0.97 0 0);
    --muted-fg: oklch(0.556 0 0);
    --border: oklch(0.922 0 0);
    --border-strong: oklch(0.85 0 0);
    --ring: oklch(0.708 0 0);
    --edge: oklch(0.52 0.06 250);
    --dot: oklch(0.556 0 0 / 0.2);
    --producer: oklch(0.541 0.281 293.009);
    --writer: oklch(0.546 0.245 262.881);
    --warning: oklch(0.7 0.18 70);
    --node-shadow: 0 1px 2px oklch(0 0 0 / 0.06);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: oklch(1 0 0);
  --canvas: oklch(0.985 0 0);
  --fg: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --accent: oklch(0.97 0 0);
  --muted-fg: oklch(0.556 0 0);
  --border: oklch(0.922 0 0);
  --border-strong: oklch(0.85 0 0);
  --ring: oklch(0.708 0 0);
  --edge: oklch(0.52 0.06 250);
  --dot: oklch(0.556 0 0 / 0.2);
  --producer: oklch(0.541 0.281 293.009);
  --writer: oklch(0.546 0.245 262.881);
  --warning: oklch(0.7 0.18 70);
  --node-shadow: 0 1px 2px oklch(0 0 0 / 0.06);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: break-word;
}
button { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }

.page {
  max-width: 1280px;
  margin-inline: auto;
  padding-inline: 24px;
  padding-block: 40px 56px;
  display: grid;
  gap: 28px;
}

/* 머리 */
.masthead { display: grid; gap: 10px; max-width: 780px; }
.eyebrow { margin: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--muted-fg); }
.eyebrow .caps { letter-spacing: 0.08em; text-transform: uppercase; }
h1 { margin: 0; font-size: 30px; line-height: 38px; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }
.lead { margin: 0; font-size: 16px; line-height: 26px; color: var(--muted-fg); max-width: 42em; }

/* 공통 조각 */
.code {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 16px;
  font-weight: 500;
  padding: 2px 6px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  color: var(--muted-fg);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.code.is-on, [aria-pressed="true"] > .code { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted-fg); }
.dot.producer { background: var(--producer); }
.dot.writer { background: var(--writer); }
.ghost {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 10px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--muted-fg);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.1s ease-out, color 0.1s ease-out;
}
.ghost:hover { background: var(--accent); color: var(--fg); }
.ghost:disabled { opacity: 0.5; cursor: not-allowed; background: transparent; color: var(--muted-fg); }
.ghost svg { width: 16px; height: 16px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 24px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--card);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.chip svg { width: 13px; height: 13px; color: var(--muted-fg); }
.chip.producer { border-color: color-mix(in oklch, var(--producer) 50%, var(--border)); background: color-mix(in oklch, var(--producer) 12%, var(--card)); }
.chip.writer { border-color: color-mix(in oklch, var(--writer) 50%, var(--border)); background: color-mix(in oklch, var(--writer) 12%, var(--card)); }
.flag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 7px;
  border: 1px dashed var(--border-strong);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted-fg);
  white-space: nowrap;
}
.flag svg { width: 12px; height: 12px; }
.flag.same { font-family: var(--font-mono); }
.flag.warn { border-style: solid; color: var(--fg); border-color: color-mix(in oklch, var(--warning) 55%, var(--border)); background: color-mix(in oklch, var(--warning) 14%, var(--card)); }
.flag.warn svg { color: var(--warning); }
.n-flags { display: flex; flex-wrap: wrap; gap: 4px; }

/* 그래프 판 */
.gcard {
  container: g / inline-size;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--canvas);
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 12px;
  padding: 12px 16px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  border-radius: 11px 11px 0 0;
}
.status { margin: 0; flex: 1 1 280px; min-width: 0; font-size: 14px; line-height: 20px; color: var(--muted-fg); }
.status b { color: var(--fg); font-weight: 600; }
.filters { order: 3; width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tb-label { font-size: 12px; color: var(--muted-fg); margin-right: 2px; }
.fchip {
  appearance: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  background: var(--card);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.1s ease-out, border-color 0.1s ease-out;
}
.fchip:hover { border-color: var(--fg); }
.fchip svg { width: 14px; height: 14px; color: var(--muted-fg); }
.fchip .cnt { font-size: 12px; color: var(--muted-fg); }
.fchip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.fchip[aria-pressed="true"] svg, .fchip[aria-pressed="true"] .cnt { color: var(--bg); }
.dots-bg {
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.4px);
  background-size: 16px 16px;
  border-radius: 0 0 11px 11px;
}

/* 넓은 화면: 왼쪽에서 오른쪽으로 흐르는 그래프 */
.lane-wrap { display: none; }
.lane-head, .lane {
  display: grid;
  grid-template-columns:
    [in] minmax(56px, 64px) 28px [kind] minmax(132px, 1.3fr) 28px [intent] minmax(120px, 1.15fr) [pick-end] 22px
    [prep] minmax(100px, 1fr) 16px [producer] minmax(96px, 1fr) 16px [writer] minmax(104px, 1fr) 16px
    [shot] minmax(92px, 1fr) 16px [board] minmax(96px, 1fr) [end];
  padding-inline: 16px;
}
.lane-head {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 4;
  row-gap: 8px;
  align-items: end;
  padding-block: 12px 10px;
  background: var(--canvas);
  border-bottom: 1px solid var(--border);
}
.lh-group {
  grid-row: 1;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border-strong);
  font-size: 12px;
  font-weight: 500;
  color: var(--muted-fg);
}
.lh { grid-row: 2; display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 12px; line-height: 16px; font-weight: 500; }
.step-num {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  flex: none;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--muted-fg);
}
.lh-btn {
  appearance: none;
  width: 100%;
  min-height: 32px;
  padding: 6px 8px;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--card);
  cursor: pointer;
  transition: border-color 0.1s ease-out, background-color 0.1s ease-out;
}
.lh-btn:hover { border-color: var(--fg); }
.lh-btn svg { width: 14px; height: 14px; color: var(--muted-fg); }

  };
  const TAG_ICON = { keep: 'check', gen: 'sparkle', lock: 'lock', warn: 'alert', need: 'info' };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const ROUTES = KINDS.flatMap((k) => (INTENTS[k.code] ? INTENTS[k.code].map((i) => `${k.code}-${i.k}`) : [k.code]));
  const kindCode = (c) => c.split('-').slice(0, 2).join('-');
  const kindOf = (c) => KINDS.find((k) => k.code === c);
  const inputOf = (c) => kindOf(kindCode(c)).input;
  const intentOf = (c) => {
    const k = c.split('-')[2];
    return k ? INTENTS[kindCode(c)].find((i) => i.k === k) : null;
  };
  const route = (c) => {
    const r = R[c];
    return r.same ? { tags: [], ...R[r.same], same: r.same } : { tags: [], ...r };
  };
  const stagesOf = (c) => STAGES.filter((s) => route(c).cells[s.key]);
  const routesOfKind = (kc) => ROUTES.filter((c) => kindCode(c) === kc);

  // 그래프의 선: 시작 상자, 끝 상자, 이 선을 지나는 길
  const EDGES = [];
  for (const k of KINDS) {
    const codes = routesOfKind(k.code);
    EDGES.push({ a: `in:${k.input}`, b: `kind:${k.code}`, routes: codes });
    for (const code of codes) {
      const chain = [];
      if (INTENTS[k.code]) {
        EDGES.push({ a: `kind:${k.code}`, b: `int:${code}`, routes: [code] });
        chain.push(`int:${code}`);
      } else {
        chain.push(`kind:${k.code}`);
      }
      for (const s of stagesOf(code)) chain.push(`st:${code}:${s.key}`);
      for (let i = 0; i < chain.length - 1; i++) EDGES.push({ a: chain[i], b: chain[i + 1], routes: [code] });
    }
  }

  const state = { focus: null };
  const $ = (s) => document.querySelector(s);
  const gcardEl = $('#gcard');
  const statusEl = $('#status');
  const filtersEl = $('#filters');
  const resetEl = $('#reset');
  const laneHeadEl = $('#lane-head');
  const laneEl = $('#lane');
  const treeEl = $('#tree');

  const isFocus = (t, v) => Boolean(state.focus && state.focus.t === t && state.focus.v === v);
  function hits() {
    const f = state.focus;
    if (!f) return null;
    if (f.t === 'input') return new Set(ROUTES.filter((c) => inputOf(c) === f.v));
    if (f.t === 'kind') return new Set(routesOfKind(f.v));
    if (f.t === 'stage') return new Set(ROUTES.filter((c) => route(c).cells[f.v]));
    return new Set([f.v]);
  }

  function statusHtml(H) {
    const f = state.focus;
    if (!f) return '상자를 누르면 그 길만 밝게 보여요. 단계 이름을 누르면 그 단계를 거치는 길이 모두 보여요.';
    const n = `<b class="mono">${H.size}</b>갈래`;
    if (f.t === 'input') return `<b>${INPUTS.find((i) => i.id === f.v).title}</b>에서 시작하는 길 ${n}`;
    if (f.t === 'kind') return `<b>${esc(kindOf(f.v).label)}</b>에서 갈리는 길 ${n}`;
    if (f.t === 'stage') {
      const s = STAGES.find((x) => x.key === f.v);
      return `<b>${esc(s.full || s.label)}</b>${s.josa} 거치는 길 ${n}`;
    }
    return `고른 길 <b class="mono">${f.v}</b>. 같은 상자를 다시 누르면 전체가 보여요.`;
  }

  function flagsHtml(code) {
    const r = route(code);
    const out = [];
    if (r.same) out.push(`<span class="flag same">${svg('equal')}${r.same}</span>`);
    for (const [t, full, short] of r.tags) {
      if (t === 'warn' || t === 'lock') out.push(`<span class="flag ${t}">${svg(TAG_ICON[t])}${esc(short || full)}</span>`);
    }
    return out.length ? `<span class="n-flags">${out.join('')}</span>` : '';
  }
  const stageLead = (s, cell) => (s.stage ? `<i class="dot ${s.stage}" aria-hidden="true"></i>` : svg((cell && cell.icon) || s.icon));

  /* 넓은 화면 그래프 */
  function laneHeadHtml() {
    let h = '<div class="lh-group" style="grid-column:in / pick-end">고르는 것</div>';
    h += '<div class="lh-group" style="grid-column:prep / end">거치는 단계</div>';
    h += '<div class="lh" style="grid-column:in"><span class="step-num">1</span>입력</div>';
    h += '<div class="lh" style="grid-column:kind"><span class="step-num">2</span>재료</div>';
    h += '<div class="lh" style="grid-column:intent"><span class="step-num">3</span>하고 싶은 것</div>';
    for (const s of STAGES) {
      h += `<button type="button" class="lh lh-btn" style="grid-column:${s.key}" data-focus="stage:${s.key}" aria-pressed="${isFocus('stage', s.key)}">${stageLead(s)}<span>${esc(s.label)}</span></button>`;
    }
    return h;
  }

  function rowCells(code, row, H, singleKind) {
    const r = route(code);
    const dim = H && !H.has(code) ? ' is-dim' : '';
    const pressed = isFocus('route', code);
    let h = '';
    if (singleKind) {
      const k = singleKind;
      h += `<button type="button" class="n n-kind single${dim}${pressed ? ' is-sel' : ''}" data-id="kind:${k.code}" data-focus="route:${code}" aria-pressed="${pressed}" style="grid-column:kind;grid-row:${row}">
        <span class="code">${k.code}</span><span class="n-title">${esc(k.label)}</span></button>`;
    } else {
      h += `<button type="button" class="n n-int${dim}${pressed ? ' is-sel' : ''}" data-id="int:${code}" data-focus="route:${code}" aria-pressed="${pressed}" style="grid-column:intent;grid-row:${row}">
        <span class="code">${code}</span><span class="n-title">${esc(intentOf(code).short)}</span>${flagsHtml(code)}</button>`;
    }
    for (const s of STAGES) {
      const cell = r.cells[s.key];
      if (!cell) continue;
      const sel = isFocus('stage', s.key) ? ' is-sel' : '';
      h += `<div class="n n-st ${s.stage || ''}${dim}${sel}" data-id="st:${code}:${s.key}" data-route="${code}" style="grid-column:${s.key};grid-row:${row}">
        ${stageLead(s, cell)}<span class="st-text">${cell.head ? `<span class="st-head">${esc(cell.head)}</span>` : ''}<span>${esc(cell.text)}</span>${cell.sub ? `<span class="n-sub">${esc(cell.sub)}</span>` : ''}</span></div>`;
    }
    return h;
  }

  function laneHtml(H) {
    const f = state.focus;
    const rows = [];
    const items = [];
    let row = 1;
    INPUTS.forEach((inp, ii) => {
      const kinds = KINDS.filter((k) => k.input === inp.id);
      const inStart = row;
      let inEnd = row;
      kinds.forEach((k, ki) => {
        const codes = routesOfKind(k.code);
        const single = !INTENTS[k.code];
        const kStart = row;
        let kEnd = row;
        codes.forEach((code, ci) => {
          rows.push('minmax(56px, auto)');
          items.push(rowCells(code, row, H, single ? k : null));
          row += 1;
          kEnd = row;
          if (f && f.t === 'route' && f.v === code) {
            rows.push('auto');
            items.push(`<div class="n-detail" style="grid-column:intent / end;grid-row:${row}">${detailHtml(code, false)}</div>`);
            row += 1;
            if (ci < codes.length - 1) kEnd = row;
          }
        });
        if (!single) {
          const kd = H && !codes.some((c) => H.has(c)) ? ' is-dim' : '';
          const ks = isFocus('kind', k.code);
          items.push(`<button type="button" class="n n-kind${kd}${ks ? ' is-sel' : ''}" data-id="kind:${k.code}" data-focus="kind:${k.code}" aria-pressed="${ks}" style="grid-column:kind;grid-row:${kStart} / ${kEnd}">
            <span class="code">${k.code}</span><span class="n-title">${esc(k.label)}</span>${k.hint ? `<span class="n-sub">${esc(k.hint)}</span>` : ''}</button>`);
        }
        inEnd = kEnd;
        if (ki < kinds.length - 1) {
          rows.push('4px');
          row += 1;
        }
      });
      const id = H && !ROUTES.some((c) => inputOf(c) === inp.id && H.has(c)) ? ' is-dim' : '';
      const is = isFocus('input', inp.id);
      items.push(`<button type="button" class="n n-in${id}${is ? ' is-sel' : ''}" data-id="in:${inp.id}" data-focus="input:${inp.id}" aria-pressed="${is}" style="grid-column:in;grid-row:${inStart} / ${inEnd}">
        ${svg(inp.icon)}<span class="n-title">${inp.title}</span><span class="code">${inp.code}</span></button>`);
      if (ii < INPUTS.length - 1) {
        rows.push('16px');
        row += 1;
      }
    });
    return { rows: rows.join(' '), html: items.join('') };
  }

  function edgePath(x1, y1, x2, y2) {
    if (Math.abs(y2 - y1) < 1.5) return `M${x1} ${y1} H${x2}`;
    const mx = x1 + (x2 - x1) / 2;
    const dir = y2 > y1 ? 1 : -1;
    const r = Math.min(8, Math.abs(y2 - y1) / 2, (x2 - x1) / 2);
    return `M${x1} ${y1} H${mx - r} Q${mx} ${y1} ${mx} ${y1 + dir * r} V${y2 - dir * r} Q${mx} ${y2} ${mx + r} ${y2} H${x2}`;
  }

  function drawEdges() {
    const svgEl = document.getElementById('edges');
    if (!svgEl || !laneEl.getClientRects().length) return;
    const box = laneEl.getBoundingClientRect();
    const W = Math.ceil(laneEl.scrollWidth);
    const Ht = Math.ceil(laneEl.scrollHeight);
    svgEl.setAttribute('width', W);
    svgEl.setAttribute('height', Ht);
    svgEl.setAttribute('viewBox', `0 0 ${W} ${Ht}`);
    const rects = new Map();
    laneEl.querySelectorAll('[data-id]').forEach((el) => rects.set(el.dataset.id, el.getBoundingClientRect()));
    const H = hits();
    const layer = { dim: '', base: '', on: '' };
    for (const e of EDGES) {
      const A = rects.get(e.a);
      const B = rects.get(e.b);
      if (!A || !B) continue;
      const x1 = A.right - box.left;
      const y1 = A.top - box.top + A.height / 2;
      const x2 = B.left - box.left - 1;
      const y2 = B.top - box.top + B.height / 2;
      const key = !H ? 'base' : e.routes.some((c) => H.has(c)) ? 'on' : 'dim';
      layer[key] += `<g class="e ${key}"><path d="${edgePath(x1, y1, x2, y2)}"/><path d="M${x2 - 6} ${y2 - 4} L${x2} ${y2} L${x2 - 6} ${y2 + 4}"/></g>`;
    }
    svgEl.innerHTML = layer.dim + layer.base + layer.on;
  }

  /* 좁은 화면 나무 */
  function chainHtml(code) {
    const r = route(code);
    const hops = stagesOf(code).map((s, i) => {
      const cell = r.cells[s.key];
      const chip = `<span class="chip ${s.stage || ''}">${stageLead(s, cell)}${esc(cell.mini || s.label)}</span>`;
      return `<span class="hop">${i ? svg('arrow', 'arr') : ''}${chip}</span>`;
    });
    return `<div class="t-chain" data-route="${code}">${hops.join('')}</div>`;
  }
  const treeDetail = (code) => (isFocus('route', code) ? `<div class="t-detail">${detailHtml(code, true)}</div>` : '');

  function treeHtml(H) {
    return INPUTS.map((inp) => {
      const kinds = KINDS.filter((k) => k.input === inp.id);
      const hit = !H || ROUTES.some((c) => inputOf(c) === inp.id && H.has(c));
      const is = isFocus('input', inp.id);
      const kindItems = kinds.map((k) => {
        const codes = routesOfKind(k.code);
        const single = !INTENTS[k.code];
        const khit = !H || codes.some((c) => H.has(c));
        const [ft, fv] = single ? ['route', codes[0]] : ['kind', k.code];
        const ks = isFocus(ft, fv);
        const node = `<button type="button" class="tn tn-kind${ks ? ' is-sel' : ''}" data-focus="${ft}:${fv}" aria-pressed="${ks}"><span class="code">${k.code}</span><span class="tn-title">${esc(k.label)}</span>${k.hint ? `<span class="tn-sub">${esc(k.hint)}</span>` : ''}</button>`;
        if (single) return `<li class="${khit ? '' : 'is-dim'}">${node}${chainHtml(codes[0])}${treeDetail(codes[0])}</li>`;
        const routeItems = codes.map((code) => {
          const rs = isFocus('route', code);
          const rhit = !H || H.has(code);
          return `<li class="${rhit ? '' : 'is-dim'}"><button type="button" class="tn tn-int${rs ? ' is-sel' : ''}" data-focus="route:${code}" aria-pressed="${rs}"><span class="code">${code}</span><span class="tn-title">${esc(intentOf(code).short)}</span>${flagsHtml(code)}</button>${chainHtml(code)}${treeDetail(code)}</li>`;
        });
        return `<li class="${khit ? '' : 'is-dim'}">${node}<ul>${routeItems.join('')}</ul></li>`;
      });
      return `<li class="${hit ? '' : 'is-dim'}"><button type="button" class="tn tn-in${is ? ' is-sel' : ''}" data-focus="input:${inp.id}" aria-pressed="${is}">${svg(inp.icon)}<span class="tn-title">${inp.title}</span><span class="code">${inp.code}</span><span class="tn-sub">${esc(inp.hint)}</span></button><ul>${kindItems.join('')}</ul></li>`;
    }).join('');
  }

  /* 고른 길 자세히 */
  function detailHtml(code, withGraph) {
    const r = route(code);
    const k = kindOf(kindCode(code));
    const it = intentOf(code);
    const crumbs = [INPUTS.find((i) => i.id === k.input).title, k.label].concat(it ? [it.short] : []).map(esc).join(svg('chev'));
    const top = `<div class="d-top"><span class="code is-on">${code}</span><span class="d-crumbs">${crumbs}</span><button type="button" class="ghost d-close" data-act="close">${svg('x')}닫기</button></div>`;
    const wish = `<div><p class="d-label">${it ? '하고 싶은 것' : '재료'}</p><h3 class="d-wish">${esc(it ? it.label : k.label)}</h3></div>`;
    const path = `<p class="d-path">${esc(r.path)}</p>`;
    const same = r.same
      ? `<p class="callout">${svg('equal')}<span><span class="mono">${r.same}</span>와 같은 길이에요. <button type="button" class="link" data-route="${r.same}">${r.same} 보기</button></span></p>`
      : '';
    const warn = r.warn ? `<p class="callout warn">${svg('alert')}<span>${esc(r.warn)}</span></p>` : '';

    let graph = '';
    if (withGraph) {
      const nodes = [`<div class="vnode is-input"><div class="vnode-head">${svg(k.input === 'text' ? 'doc' : 'image')}<span>${k.input === 'text' ? '글 입력' : '이미지 입력'}</span></div><div class="vnode-body"><span>${esc(k.node)}</span>${k.hint ? `<span class="n-sub">${esc(k.hint)}</span>` : ''}</div></div>`];
      for (const s of stagesOf(code)) {
        const cell = r.cells[s.key];
        nodes.push(`<div class="vnode ${s.stage || ''}"><div class="vnode-head">${svg(cell.icon || s.icon)}<span>${esc(cell.head || s.full || s.label)}</span></div><div class="vnode-body"><span>${esc(cell.text)}</span>${cell.sub ? `<span class="n-sub">${esc(cell.sub)}</span>` : ''}</div></div>`);
      }
      graph = `<div class="vgraph" aria-label="거쳐 가는 단계">${nodes.join(`<div class="vedge" aria-hidden="true">${svg('down')}</div>`)}</div>`;
    }

    const facts = [];
    if (r.takes) {
      const takes = r.takes
        .map(([name, yes]) =>
          yes
            ? `<span class="take">${svg('check')}${esc(name)}</span>`
            : `<span class="take no">${svg('minus')}<s>${esc(name)}</s><span class="sr">(가져가지 않음)</span></span>`,
        )
        .join('');
      facts.push([`${esc(k.node)}에서 가져가는 것`, `<span class="takes">${takes}</span>`]);
    }
    for (const [dt, dd] of r.facts || []) facts.push([esc(dt), esc(dd)]);
    if (r.tags.length) {
      facts.push(['특징', `<span class="tags">${r.tags.map(([t, full]) => `<span class="tag ${t}">${svg(TAG_ICON[t])}${esc(full)}</span>`).join('')}</span>`]);
    }
    facts.push(['원문', `<span class="src">${r.same ? `(${r.same}와 동일) ` : ''}${esc(r.src)}</span>`]);

    return `<article class="detail">${top}<div class="d-main"><div class="d-left">${wish}${path}${same}${warn}${graph}</div><dl class="facts">${facts.map(([t, d]) => `<dt>${t}</dt><dd>${d}</dd>`).join('')}</dl></div></article>`;
  }

  function render(refocus) {
    const H = hits();
    statusEl.innerHTML = statusHtml(H);
    filtersEl.innerHTML = '<span class="tb-label">단계로 보기</span>' + STAGES.map((s) => {
      const count = ROUTES.filter((c) => route(c).cells[s.key]).length;
      return `<button type="button" class="fchip" data-focus="stage:${s.key}" aria-pressed="${isFocus('stage', s.key)}">${stageLead(s)}${esc(s.label)}<span class="cnt mono">${count}</span></button>`;
    }).join('');
    resetEl.disabled = !state.focus;
    laneHeadEl.innerHTML = laneHeadHtml();
    const lane = laneHtml(H);
    laneEl.style.gridTemplateRows = lane.rows;
    laneEl.innerHTML = `<svg class="edges" id="edges" aria-hidden="true" focusable="false"></svg>${lane.html}`;
    treeEl.innerHTML = treeHtml(H);
    requestAnimationFrame(drawEdges);
    if (refocus) {
      const el = refocus.root.querySelector(refocus.sel);
      if (el) el.focus({ preventScroll: true });
    }
  }

  gcardEl.addEventListener('click', (e) => {
    const root = e.target.closest('#toolbar, #lane-head, #lane, #tree');
    const fb = e.target.closest('[data-focus]');
    if (fb) {
      const raw = fb.dataset.focus;
      const i = raw.indexOf(':');
      const t = raw.slice(0, i);
      const v = raw.slice(i + 1);
      state.focus = isFocus(t, v) ? null : { t, v };
      render(root ? { root, sel: `[data-focus="${raw}"]` } : null);
      return;
    }
    const rb = e.target.closest('[data-route]');
    if (rb) {
      const v = rb.dataset.route;
      state.focus = isFocus('route', v) ? null : { t: 'route', v };
      render();
      return;
    }
    if (e.target.closest('[data-act="close"]')) {
      const was = state.focus && state.focus.v;
      state.focus = null;
      render(root && was ? { root, sel: `[data-focus="route:${was}"]` } : null);
    }
  });
  resetEl.addEventListener('click', () => {
    state.focus = null;
    render();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.focus) {
      state.focus = null;
      render();
    }
  });

  resetEl.innerHTML = `${svg('reset')}처음부터`;
  $('#legend').innerHTML = '<span class="chip producer"><i class="dot producer"></i>Producer</span><span class="chip writer"><i class="dot writer"></i>Writer</span><span>단계 색은 Tale Studio 화면과 같아요.</span>';

  new ResizeObserver(() => requestAnimationFrame(drawEdges)).observe(laneEl);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => requestAnimationFrame(drawEdges));

  const hash = decodeURIComponent(location.hash.slice(1));
  if (R[hash]) state.focus = { t: 'route', v: hash };
  else if (kindOf(hash)) state.focus = { t: 'kind', v: hash };
  else if (STAGES.some((s) => s.key === hash)) state.focus = { t: 'stage', v: hash };
  render();
  // 링크로 길을 열었으면 그 길의 자세히로 내려간다
  if (state.focus && state.focus.t === 'route') {
    requestAnimationFrame(() => {
      const d = Array.from(document.querySelectorAll('.detail')).find((el) => el.getClientRects().length);
      if (d) d.scrollIntoView({ block: 'center' });
    });
  }
})();
</script>

</body></html>
