deURI('../Tale-Studio-analysis/'+s.uiSource.split(':')[0]+'#L'+s.uiSource.split(':')[1])}\" target=\"_blank\" rel=\"noopener\">실제 탭·화면 코드 ↗\u003c/a>\u003c/div>`;\n      $('moduleGrid').innerHTML=s.modules.map((m,i)=>{\n        const items=m.paths.flatMap(byPath);\n        const calls=m.calls.length?m.calls.map(c=>`\u003cdiv class=\"feature-call\">\u003cspan class=\"call-type\">${esc(c.type)}\u003c/span>\u003cdiv class=\"call-line\">\u003cstrong>${esc(c.model)}\u003c/strong>\u003csmall>${esc(c.provider)}\u003c/small>\u003c/div>\u003ccode>${esc(c.endpoint)}\u003c/code>\u003cp>${esc(c.detail)}\u003c/p>\u003c/div>`).join(''):'\u003cdiv class=\"no-model\">\u003cstrong>새 생성 모델 호출 없음\u003c/strong>\u003cspan>이 영역은 입력·선택·조회·저장 기능입니다.\u003c/span>\u003c/div>';\n        return `\u003carticle class=\"module-card feature-card\" style=\"--stage:${s.color}\">\u003cdiv class=\"module-head\">\u003cspan class=\"quad\">${esc(m.kind)} · ${String(i+1).padStart(2,'0')}\u003c/span>\u003ch4>${esc(m.name)}\u003c/h4>\u003cp>${esc(m.desc)}\u003c/p>\u003c/div>\u003cdiv class=\"feature-calls\">${calls}\u003c/div>\u003cdiv class=\"module-note\">${esc(m.note)}\u003c/div>\u003cdetails class=\"model-evidence\">\u003csummary>코드 근거 · 내부 경로 ${items.length}개\u003c/summary>\u003cdiv class=\"source-list\">${m.sources.map(src=>{const [path,line]=src.split(':');return `\u003ca href=\"${encodeURI('../Tale-Studio-analysis/'+path+'#L'+line)}\" target=\"_blank\" rel=\"noopener\">${esc(src)}\u003c/a>`}).join('')}\u003c/div>\u003cdiv class=\"endpoint-list\">${items.map(r=>`\u003cbutton type=\"button\" class=\"endpoint\" data-route=\"${ROUTES.indexOf(r)}\">${methodBadge(r.method)}\u003cspan>\u003ccode>${esc(r.endpoint)}\u003c/code>\u003c/span>\u003c/button>`).join('')||'\u003cp class=\"graph-hint\">전용 HTTP API 없음\u003c/p>'}\u003c/div>\u003c/details>\u003c/article>`\n      }).join('');\n      $('moduleGrid').querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>openRoute(ROUTES[Number(b.dataset.route)]));\n    }\n    function makeGraph(boardId,nodes,edges,config){\n      const board=$(boardId);board.style.width=config.width+'px';board.style.height=config.height+'px';\n      board.innerHTML=`\u003csvg width=\"${config.width}\" height=\"${config.height}\" viewBox=\"0 0 ${config.width} ${config.height}\" aria-hidden=\"true\">\u003cdefs>\u003cmarker id=\"arrow-${boardId}\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\u003cpath d=\"M0 0 L8 4 L0 8 Z\" fill=\"#72aaa9\"/>\u003c/marker>\u003cmarker id=\"arrow-manual-${boardId}\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\u003cpath d=\"M0 0 L8 4 L0 8 Z\" fill=\"#e3a260\"/>\u003c/marker>\u003c/defs>\u003cg class=\"edges\">\u003c/g>\u003c/svg>${nodes.map(n=>`\u003cbutton type=\"button\" class=\"graph-node ${esc(n.kind||'')}\" data-node=\"${n.id}\" style=\"left:${n.x}px;top:${n.y}px;width:${n.w}px;--node-color:${n.color||'#269994'}\">\u003cspan class=\"tag\">${esc(n.tag)}\u003c/span>\u003cstrong>${esc(n.title)}\u003c/strong>\u003csmall>${esc(n.sub)}\u003c/small>${boardId==='impactBoard'&&IMPACT_META[n.id]?`\u003cspan class=\"impact-meta\">\u003cspan>\u003cb>직접\u003c/b> ${esc(IMPACT_META[n.id][0])}\u003c/span>\u003cspan>\u003cb>반영\u003c/b> ${esc(IMPACT_META[n.id][1])}\u003c/span>\u003c/span>`:''}\u003c/button>`).join('')}`;\n      const map=Object.fromEntries(nodes.map(n=>[n.id,n]));const g=board.querySelector('.edges');\n      g.innerHTML=edges.map((e,i)=>{const a=map[e[0]],b=map[e[1]],manual=e[2]==='manual';const fromX=a.x+a.w,fromY=a.y+45,toX=b.x,toY=b.y+45;let path;\n        if(Math.abs(a.x-b.x)\u003c20 && b.y>a.y){const midX=a.x+a.w/2,endX=b.x+b.w/2,startY=a.y+82,endY=b.y;const gap=Math.max(24,(endY-startY)*.42);path=`M${midX} ${startY} C${midX} ${startY+gap},${endX} ${endY-gap},${endX} ${endY}`}\n        else if(toX>fromX+20){const gap=Math.max(42,(toX-fromX)*.43);path=`M${fromX} ${fromY} C${fromX+gap} ${fromY},${toX-gap} ${toY},${toX} ${toY}`}\n        else{const lane=Math.max(a.y,b.y)+120;path=`M${fromX-32} ${fromY+15} C${fromX-15} ${lane},${toX+40} ${lane},${toX+15} ${toY+52}`}\n        const edgeId=`edge-${boardId}-${i}`;\n        return `\u003cpath id=\"${edgeId}\" class=\"graph-edge ${manual?'manual':''}\" data-from=\"${e[0]}\" data-to=\"${e[1]}\" d=\"${path}\" marker-end=\"url(#arrow-${manual?'manual-':''}${boardId})\"/>${e[3]?`\u003ctext class=\"graph-edge-label ${manual?'manual':''}\">\u003ctextPath href=\"#${edgeId}\" startOffset=\"50%\" text-anchor=\"middle\">${esc(e[3])}\u003c/textPath>\u003c/text>`:''}`\n      }).join('');\n      return board;\n    }\n    function reachable(start,edges){const seen=new Set([start]);let changed=true;while(changed){changed=false;for(const e of edges)if(seen.has(e[0])&&!seen.has(e[1])){seen.add(e[1]);changed=true}}return seen}\n    function detailHTML(node,downstream,category){return `\u003cdiv>\u003cdiv class=\"overline\">${category}\u003c/div>\u003ch3>${esc(node.title)}\u003c/h3>\u003cp>${esc(node.sub)}\u003c/p>\u003c/div>\u003cdiv>\u003cp>${esc(node.detail)}\u003c/p>\u003cdiv class=\"detail-chips\">${(node.chips||[]).map(x=>`\u003cspan>${esc(x)}\u003c/span>`).join('')}${downstream?.length?`\u003cspan>영향 범위 ${downstream.length}개 노드\u003c/span>`:''}\u003c/div>\u003c/div>`}\n    function renderImpact(){\n      const board=makeGraph('impactBoard',IMPACT_NODES,IMPACT_EDGES,{width:1330,height:710});\n      board.querySelectorAll('.graph-node').forEach(b=>b.onclick=()=>selectImpact(activeImpact===b.dataset.node?null:b.dataset.node));\n      $('impactScroll').onclick=e=>{if(!e.target.closest('.graph-node,.graph-edge'))selectImpact(null)};\n      selectImpact(activeImpact);\n    }\n    function fitImpactBoard(){if($('impact').hidden)return;const width=$('impactScroll').clientWidth;if(width)$('impactBoard').style.zoom=String(Math.min(1,width/1330))}\n    $('impactReset').onclick=()=>selectImpact(null);\n    function sourceLinks(list){return `\u003cdiv class=\"source-list\">${list.map(src=>{co stion)}\u003c/p>\u003c/div>\u003c/div>`;}\n renderJourneyFocus();\n $('journeyNotes').onclick=()=>openJourneyNotes(c,leader);\n $('journeyNotes').textContent=leader?'자동화 범위·미구현 기능 ↗':'현재 업로드 지원·구현 차이 ↗';\n $('journeyMap').querySelectorAll('[data-journey-step]').forEach(b=>b.onclick=()=>{journeyStep=Number(b.dataset.journeyStep);renderJourneys()});\n}\nfunction renderStaffMap(c){\n const v=STAFF_VISUALS[c.id],workImage=c.stage==='artist'?v.input:c.stage==='editor'?'timeline':c.stage==='producer'?'brief':'output';\n const steps=[['자료 등록',['원본 파일·순서','보존·변경 범위'],'원본 + 순서·용도',v.input],['내용 구조화',v.parse,'출처 + 추출 후보','structure'],['담당 산출물',v.work,'초안 + 변경점',workImage],['검토·승인',v.review,'YES / NO','review'],['동료에게 인계',v.handoff,'승인 버전 + 원천','handoff']];\n $('journeyMap').innerHTML=`\u003cdiv class=\"staff-route\">${steps.map(([title,items,edge,picture],i)=>`\u003cdiv class=\"staff-route-cell\">\u003cbutton type=\"button\" data-journey-step=\"${i}\" class=\"journey-card illustrated-card ${journeyStep===i?'selected':''} ${i===3?'is-decision':''}\" aria-pressed=\"${journeyStep===i}\">\u003cspan>\u003csmall>${String(i+1).padStart(2,'0')}\u003c/small>\u003cb>${title}\u003c/b>\u003c/span>${journeyIllustration(picture)}\u003cul>${items.map(t=>`\u003cli>${esc(t)}\u003c/li>`).join('')}\u003c/ul>\u003c/button>\u003cdiv class=\"journey-edge\">${esc(edge)}${i\u003c4?' →':''}\u003c/div>\u003c/div>`).join('')}\u003c/div>\u003cdiv class=\"journey-loop\">\u003cspan>↳ NO · 수정 요청 + 대상 ID\u003c/span>\u003cspan>담당 산출물 보완 ↺ 재검토\u003c/span>\u003cb>YES · ${esc(c.reviewer)} 승인 → 인계\u003c/b>\u003c/div>`;\n}\nfunction renderLeaderMap(c){\n $('journeyMap').innerHTML=`\u003cdiv class=\"crew-route\">${STAGES.map((s,i)=>{const d=c.stageWork[i];return `\u003cbutton type=\"button\" class=\"crew-card ${journeyStep===i?'selected':''}\" data-journey-step=\"${i}\" style=\"--stage:${s.color}\" aria-pressed=\"${journeyStep===i}\">\u003cspan class=\"crew-card-head\">${atlasIcon(i===0?'compass':i===1?'pen':i===2?'image':i===3?'frame':'cut')}\u003cb>AI ${s.name}\u003c/b>\u003c/span>\u003csmall>받는 정보\u003c/small>\u003cdiv class=\"crew-input\">${esc(d[0])}\u003c/div>\u003csmall>이 Crew에 기대하는 자동 작업\u003c/small>\u003cp>${esc(d[1])}\u003c/p>\u003cspan class=\"crew-output\">${esc(d[3])} ${i\u003c4?'→':''}\u003c/span>${i===4?'\u003cem>Editor Crew · 현재 미지원\u003c/em>':''}\u003c/button>`}).join('')}\u003c/div>\u003cdiv class=\"journey-loop\">\u003cspan>전체를 책임지되 반복 생성·연결 작업은 Crew에 위임\u003c/span>\u003cb>검토 NO → 대상 씬/에셋/샷만 수정 ↺ 같은 검토로\u003c/b>\u003c/div>`;\n}\nfunction renderJourneyFocus(){\n const c=journeyCase(),leader=activePersona==='leader';\n if(leader){const d=c.stageWork[journeyStep],s=STAGES[journeyStep];$('journeyFocus').innerHTML=`\u003cdiv class=\"focus-label\">\u003cb>${s.name} 검토 지점\u003c/b>\u003cspan>핵심 결정은 사용자\u003c/span>\u003c/div>\u003cdiv>\u003csmall>내가 확인·승인할 것\u003c/small>\u003cp>${esc(d[2])}\u003c/p>\u003c/div>\u003cdiv>\u003csmall>${journeyStep===4?'최종 출력':'다음 Crew에 넘길 것'}\u003c/small>\u003cp>${esc(d[3])}\u003c/p>\u003c/div>\u003cdiv>\u003csmall>전체 결과의 성공 기준\u003c/small>\u003cp>${esc(c.checks[journeyStep%3])}\u003c/p>\u003c/div>`;}\n else {const details=[['입력 확인','담당 직원','파일의 순서·용도·보존 범위를 지정',c.preserve],['구조화 확인','담당 직원 + AI',c.parse,'오독·누락·AI 추정 표시 후 대상 ID 확정'],['담당 작업',c.role,c.work,c.output],['검토·승인',c.reviewer,c.review,'승인 버전 지정 또는 수정 요청'],['협업·완료','담당 직원 → 다음 담당자',c.to,c.done]][journeyStep];$('journeyFocus').innerHTML=`\u003cdiv class=\"focus-label\">\u003cb>${details[0]}\u003c/b>\u003cspan>${esc(details[1])}\u003c/span>\u003c/div>\u003cdiv>\u003csmall>화면에서 확인하는 형태\u003c/small>\u003cp>${esc(details[2])}\u003c/p>\u003c/div>\u003cdiv>\u003csmall>이 단계의 출력·완료 기준\u003c/small>\u003cp>${esc(details[3])}\u003c/p>\u003c/div>\u003cdiv>\u003csmall>자주 생길 문제\u003c/small>\u003cp>${esc(c.risk)}\u003c/p>\u003c/div>`;}\n let note=$('journeyImplementation');if(!note){note=document.createElement('div');note.id='journeyImplementation';$('journeyFocus').after(note)}\n note.innerHTML=leader?`\u003cb>목표 자동화\u003c/b>\u003cspan>${c.id!=='mobile'?'원작·전작 자료가 없으므로 입력한 설명에 대한 창작 가설입니다. 원작 충실도·전작 설정 검증에는 A의 실제 자료가 필요합니다.':'대표 결과·씬 확정·영상 생성 범위를 검토하며 진행하는 목표 UX입니다.'} 현재 5개 Crew의 끝까지 자동 연결·AI Editor는 구현되어 있지 않습니다.\u003c/span>`:`\u003cb>현재 ↔ 목표\u003c/b>\u003cspan>${esc(c.gap)}\u003c/span>`;\n}\nfunction openJourneyNotes(c,leader){openInfo(leader?'B · 전체 자동화의 기대와 현재 범위':`${c.label} · 입력과 협업`,'04 · 목표 UX',`\u003cdiv class=\"block\">\u003clabel>${leader?'전체 결과 검토':'대표 시나리오'}\u003c/label>\u003cp>${esc(leader?c.intent:c.request)}\u003c/p>\u003c/div>${leader?`\u003cdiv class=\"block\">\u003clabel>기대되는 5개 Crew\u003c/label>\u003cp>Producer는 의도와 기획을 구조화하고, Writer는 씬·샷·대사, Artist는 일관된 에셋, Director는 실사·Take, Editor는 전체 흐름의 편집 초안을 준비합니다. 사용자는 핵심 승인 지점에서 판단합니다.\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>현재 코드와 차이\u003c/label>\u003cp>전용 채팅은 Producer / Writer / Artist / Director 4개입니다. Editor 채팅, 전 과정 자동 오케스트레이션, 자동 편집·협업 승인 흐름은 목표 설계입니다.\u003c/p>\u003c/div>`:`\u003cdiv class=\"block\">\u003clabel>현재 업로드 지원\u003c/label>\u003cp>Producer 첨부: TXT·MD·Markdown·DOCX, JPG·JPEG·PNG·WebP. PDF는 텍스트 또는 페이지 이미지로 변환해야 합니다. 텍스트 100 KiB, DOCX 20 MiB(추출 텍스트 100 KiB), 이미지 장당 10 MiB, 최대 20장입니다.\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>웹툰 긴 이미지\u003c/label>\u003cp>가로 8,000px / 세로 60,000px / 총 60M 픽셀 제한. 비전용 긴 변 1,568px의 조각으로 나누고 최대 40조각으로 제한합니다. 이 처리는 의미 단위의 컷·말풍선 추출 완료를 뜻하지 않습니다. 잘림과 판독 결과를 확인해야 합니다.\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>이 사례의 구현 차이\u003c/label>\u003cp>${esc(c.gap)}\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>협업 인계 묶음 · 제안\u003c/label>\u003cp>${esc(c.output)}\u003cbr>+ 원천 파일/출처 + 대상 ID + 선택 버전 + 검토자 + 승인 상태 + 남은 질문.\u003cbr>${esc(c.to)}. 공유 방법·권한·버전 충돌 처리는 05에서 구체화합니다.\u003c/p>\u003c/div>${sourceLinks(['src/app/api/produce/ingest/route.ts:1','src/lib/upload/limits.ts:1'])}`}\u003cdiv class=\"block\">\u003clabel>기획 확정 후\u003c/label>\u003cp>Producer 복귀 금지 정책을 전제로 합니다. 잠금 항목·변경 예외·권한은 TBD이며 현재 제품 코드에 적용한 기능이 아닙니다.\u003c/p>\u003c/div>`)}\nfunction showProducerPolicy(){openInfo('Producer 확정 후 복귀 금지','04 · 목표 정책',`\u003cdiv class=\"block\">\u003clabel>확정 전\u003c/label>\u003cp>기획 보조는 자료와 미결 질문을 정리하고 책임자가 확정합니다. B는 본인의 기획을 확정합니다.\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>확정 후\u003c/label>\u003cp>담당자는 확정 기획을 참조해 후속 작업으로 진입합니다. Producer로 돌아가 재결정하지 않습니다.\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>05 · TBD\u003c/label>\u003cp>잠금 항목, 확정 권한, 기획 변경 예외, 수정 영향과 진행 중 작업 처리. 현재 코드는 열린 단계 재방문이 가능합니다.\u003c/p>\u003c/div>`)}\n$('personaCompare').onclick=()=>openInfo('A / B의 성공 기준','04 · 사용자 관점',`\u003cdiv class=\"block\">\u003ctable class=\"journey-role-table\">\u003ctr>\u003cth>\u003c/th>\u003cth>A · 실무자\u003c/th>\u003cth>B · 총괄자\u003c/th>\u003c/tr>\u003ctr>\u003cth>출발\u003c/th>\u003ctd>원작·문서·이미지·업무 지시\u003c/td>\u003ctd>머릿속 아이디어와 제작 목적\u003c/td>\u003c/tr>\u003ctr>\u003cth>AI에 기대\u003c/th>\u003ctd>자료 보존·구조화·담당 작업 보완\u003c/td>\u003ctd>각 단계의 초안과 연결을 자동 준비\u003c/td>\u003c/tr>\u003ctr>\u003cth>완료\u003c/th>\u003ctd>검수한 담당 산출물을 동료에게 인계\u003c/td>\u003ctd>전체 결과를 보고 제작 방향 판단\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\u003cdiv class=\"block\">\u003cp>B는 서비스의 전체 여정을 사용하지만 QA를 위해 모든 메뉴를 누르는 사람은 아닙니다. 결과를 완성하고 판단하기 위해 반복 조작을 위임하는 사용자입니다. A는 직무 하나가 아니라 입력 자료·담당 업무별 시나리오 묶음입니다.\u003c/p>\u003c/div>`);\n\n    const sectionOrder=['api-map','impact','flow','journey','qa'];\n    function activateSection(id,updateHash=true){\n      if(!sectionOrder.includes(id))id='api-map';\n      document.body.classList.add('compact-hero');\n      sectionOrder.forEach(key=>{\n        const selected=key===id;\n        $(key).hidden=!selected;\n        const button=$('analysisTabs').querySelector(`[data-section=\"${key}\"]`);\n        button.classList.toggle('active',selected);\n        button.setAttribute('aria-selected',String(selected));\n        button.tabIndex=selected?0:-1;\n      });\n      if(id==='impact')fitImpactBoard();\n      if(updateHash){history.replaceState(null,'','#'+id);window.scrollTo({top:0,behavior:'smooth'})}\n    }\n    $('analysisTabs').querySelectorAll('[data-section]').forEach(button=>{\n      button.onclick=()=>activateSection(button.dataset.section);\n      button.onkeydown=e=>{\n        const current=sectionOrder.indexOf(button.dataset.section);\n        const next=e.key==='ArrowRight'?sectionOrder[(current+1)%sectionOrder.length]:e.key==='ArrowLeft'?sectionOrder[(current+sectionOrder.length-1)%sectionOrder.length]:e.key==='Home'?sectionOrder[0]:e.key==='End'?sectionOrder.at(-1):null;\n        if(next){e.preventDefault();activateSection(next);$('analysisTabs').querySelector(`[data-section=\"${next}\"]`).focus()}\n      };\n    });\n    window.addEventListener('hashchange',()=>activateSection(location.hash.slice(1),false));\n    window.addEventListener('resize',fitImpactBoard);\n    $('readingGuide').onclick=()=>openInfo('처음 보는 분을 위한 지도','UX/UI 기획 · QA',`\u003cdiv class=\"block\">\u003clabel>읽는 순서\u003c/label>\u003cp>\u003cb>01\u003c/b> 어느 화면에서 무엇을 만들고 어떤 모델을 쓰는가\u003cbr>\u003cb>02\u003c/b> 입력을 바꾸면 어떤 결과를 다시 만들어야 하는가\u003cbr>\u003cb>03\u003c/b> 직접 조작·채팅·저장·생성과 단계 개방은 어떻게 이어지는가\u003cbr>\u003cb>04\u003c/b> 직원·리더는 어떤 입력으로 시작해 어디서 가치를 얻는가 (목표 UX)\u003cbr>\u003cb>05\u003c/b> 미정(TBD) · 전체 정책·예외 확장 예정, 기존 QA 초안 참고\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>같은 말처럼 보여도 다른 상태\u003c/label>\u003cp>현재 단계는 지금 보는 화면입니다. 열린 단계는 방문 권한의 진행 범위이고, 생성 완료를 뜻하지 않습니다. 작업은 화면을 떠나도 진행될 수 있습니다.\u003cbr>씬은 장면, 샷은 한 촬영 단위, Take는 같은 샷에서 생성한 영상 후보입니다. Previz는 이 UI에서 러프 이미지 보기입니다.\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>검증 범위\u003c/label>\u003cp>dev cb7ed81c 소스와 UI 호출 연결을 검토했습니다. 실제 서비스·DB·모델 호출은 실행하지 않았습니다. 04는 사용자 요구 기반 목표 저니이며, Producer 잠금과 자동화는 현재 구현과 구분합니다. 05는 구조 미정이며 기존 코드상 위험·QA 초안을 보관합니다.\u003c/p>\u003c/div>`);\n    $('activePathNote').onclick=()=>openInfo('활성 기능과 남아 있는 코드','소스 검토 결과',`\u003cdiv class=\"block\">\u003clabel>Previz = 러프 3프레임 이미지\u003c/label>\u003cp>현재 Previz는 Writer 러프를 표시합니다. 재생성 버튼은 rough-storyboard API를 호출합니다. 별도 Previz 영상 API와 store 함수는 남아 있지만 현재 UI 호출자를 찾지 못했습니다. 정상 지도에서는 제외했습니다.\u003c/p>${sourceLinks(['src/features/director/canvas-views/StoryboardGridView.tsx:220','src/stores/director-store.ts:1195','src/stores/writer-store.ts:771'])}\u003c/div>\u003cdiv class=\"block\">\u003clabel>Writer 기본 V1 · V2는 조건부\u003c/label>\u003cp>V2 units는 관리자 V2 실행 프로젝트에만 표시됩니다. 기본 제작 흐름은 V1이며 시간 예산·씬 확인 게이트가 여기에 포함됩니다.\u003c/p>${sourceLinks(['src/lib/writer/engine.ts:10','src/features/writer/writer-tabs.tsx:34','src/app/api/writer/start/route.ts:304'])}\u003c/div>`);\n\n    $('sourceVersion').onclick=()=>openInfo('이 HTML의 기준 소스·버전','SOURCE PROVENANCE',`\u003cdiv class=\"block\">\u003clabel>분석 원본\u003c/label>\u003cp>\u003cb>Tale-Studio-20261007.bundle\u003c/b>\u003cbr>분석 체크아웃: Tale-Studio-analysis\u003cbr>브랜치: dev\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>코드 버전 · Git HEAD\u003c/label>\u003cp>\u003ccode>cb7ed81c265b36b9eb7408a2598acd3f090f0178\u003c/code>\u003cbr>커밋 시각: 2026-09-29 13:21:49 +09:00 (KST)\u003cbr>커밋 제목: revert(proto-v04/g1): 그룹 1 코드 되돌림 — 오너 요청, 그룹 나누기부터 다시 논의\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>세 날짜를 구분해 읽기\u003c/label>\u003cp>\u003cb>2026-09-29\u003c/b> — 분석한 코드의 마지막 커밋 날짜\u003cbr>\u003cb>2026-10-07\u003c/b> — 제공된 번들 파일명의 날짜\u003cbr>\u003cb>2026-10-08\u003c/b> — 이 HTML의 내용 수정일\u003c/p>\u003c/div>\u003cdiv class=\"block\">\u003clabel>문서 범위\u003c/label>\u003cp>01–03: 위 소스의 정적 분석\u003cbr>04: Persona별 목표 UX · 기획 초안\u003cbr>05: 미정(TBD) · 기존 코드 QA 참고 초안\u003cbr>현재 운영 배포 버전이나 실제 호출 통계는 이 문서로 확인할 수 없습니다.\u003c/p>\u003c/div>`);\n    $('producerPolicy').onclick=showProducerPolicy;\n    renderImpact();renderFlowOverview();renderModelMap();renderQA();renderJourneys();activateSection(location.hash.slice(1),false);\n    // Event delegation keeps hover/focus previews working after each view rerenders.\nfunction clearInteractionPreview(){\n document.querySelectorAll('.peek-hit,.peek-muted,.peek-node,.peek-edge').forEach(n=>n.classList.remove('peek-hit','peek-muted','peek-node','peek-edge'));\n $('impactBoard').classList.remove('impact-preview');\n}\nfunction showInteractionPreview(el){\n clearInteractionPreview();if(!el)return;\n if(el.dataset.catalogModel){document.querySelectorAll('[data-model-path]').forEach(n=>{const hit=(MODEL_OPTIONS[Number(n.dataset.modelPath)]||[]).some(m=>m[0]===el.dataset.catalogModel);n.classList.add(hit?'peek-hit':'peek-muted')})}\n if(el.dataset.node||el.matches('.graph-edge')){\n  const ids=new Set(el.dataset.node?[el.dataset.node]:[el.dataset.from,el.dataset.to]);\n  const edgeSet=el.dataset.node?IMPACT_LINKS.filter(e=>e.from===el.dataset.node||e.to===el.dataset.node):IMPACT_LINKS.filter(e=>e.from===el.dataset.from&&e.to===el.dataset.to);\n  edgeSet.forEach(e=>{ids.add(e.from);ids.add(e.to)});$('impactBoard').classList.add('impact-preview');\n  $('impactBoard').querySelectorAll('.graph-node').forEach(n=>n.classList.toggle('peek-node',ids.has(n.dataset.node)));\n  $('impactBoard').querySelectorAll('.graph-edge').forEach(n=>n.classList.toggle('peek-edge',edgeSet.some(e=>e.from===n.dataset.from&&e.to===n.dataset.to)));\n }\n}\nfunction interactiveTarget(target){return target instanceof Element?target.closest('button,summary,.graph-edge'):null}\ndocument.addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const el=interactiveTarget(e.target);if(el&&(!e.relatedTarget||!el.contains(e.relatedTarget)))showInteractionPreview(el)});\ndocument.addEventListener('pointerout',e=>{const el=interactiveTarget(e.target);if(el&&(!e.relatedTarget||!el.contains(e.relatedTarget)))clearInteractionPreview()});\ndocument.addEventListener('focusin',e=>{const el=interactiveTarget(e.target);if(el?.matches(':focus-visible'))showInteractionPreview(el)});\ndocument.addEventListener('focusout',clearInteractionPreview);\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')clearInteractionPreview()});\ndocument.addEventListener('scroll',clearInteractionPreview,true);window.addEventListener('resize',clearInteractionPreview);\ndocument.addEventListener('click',e=>{\n clearInteractionPreview();const el=interactiveTarget(e.target);\n if(e.detail===0&&el&&el.tagName==='BUTTON'){\n  const key=['data-catalog-model','data-model-path','data-node','data-edge-choice','data-logic-stage','data-logic','data-persona','data-scenario','data-journey-step','data-qa-case','data-qa-filter'].find(k=>el.hasAttribute(k));\n  if(key)queueMicrotask(()=>{if(!$('drawerBackdrop').classList.contains('open'))document.querySelector(`[${key}=\"${CSS.escape(el.getAttribute(key))}\"]`)?.focus({preventScroll:true})});\n }\n});\n\n    window.addEventListener('load',()=>window.scrollTo({top:0,behavior:'instant'}),{once:true});\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n"};
(function () {
  var frames = document.getElementById('frames'), made = {};
  function open(k) {
    if (!PAGES[k]) k = 'producer';
    if (!made[k]) {
      var f = document.createElement('iframe');
      f.title = document.querySelector('#tab-' + k + ' b').textContent;
      f.dataset.k = k; f.srcdoc = PAGES[k];
      frames.appendChild(f); made[k] = f;
    }
    Object.keys(made).forEach(function (x) { made[x].classList.toggle('on', x === k); });
    document.querySelectorAll('.bar [data-tab]').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === k)); });
    if (location.hash !== '#' + k) history.replaceState(null, '', '#' + k);
  }
  document.querySelector('.bar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]'); if (b) open(b.dataset.tab);
  });
  window.addEventListener('hashchange', function () { open(location.hash.slice(1)); });
  var h = location.hash.slice(1); if (h === 'writer') h = 'pipeline'; open(h || 'producer');
})();
