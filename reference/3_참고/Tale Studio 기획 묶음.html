<title>Tale Studio 기획 묶음</title>
<style>
:root{--bg:#0f2032;--ink:#f3f7fa;--muted:#9fb3c2;--line:#2b4256;--acc:#8c68d6;--page:#f2f4f6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);font-family:"Noto Sans KR","Pretendard",system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{position:fixed;top:0;left:0;right:0;height:56px;z-index:10;background:var(--bg);color:var(--ink);display:flex;align-items:stretch;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.brand{display:flex;align-items:center;font-weight:800;font-size:14px;padding-right:14px;margin-right:6px;border-right:1px solid var(--line);white-space:nowrap}

.bar button b{font-size:14px;font-weight:800}
.bar button small{font-size:11px;opacity:.8}
.bar button:hover{color:var(--ink)}
.bar button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acc)}
.bar button:focus-visible{outline:3px solid #2c9cce;outline-offset:-3px}
.frames{position:fixed;top:56px;left:0;right:0;bottom:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--page);display:none}
.frames iframe.on{display:block}

</style>
</head>

<script>
var PAGES = {"producer": "\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>시작부터 Writer까지 화면 흐름\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap\">\n\u003cstyle>\n:root{\n  --paper:#f2f4f6; --card:#ffffff; --ink:#18232e; --muted:#5f6f7c; --line:#dde3e8; --soft:#eef2f5;\n  --violet:#8c68d6; --violet-ink:#6a49b8; --violet-soft:#f1ecfb; --teal:#13958f; --teal-soft:#e5f5f3; --amber:#b9781a; --amber-soft:#fff6e6; --rose:#c4566f; --rose-soft:#fdecee; --blue:#3f7fd0;\n  --m-bg:#0b0b0c; --m-panel:#121214; --m-card:#17171a; --m-line:#2a2a2f; --m-ink:#f2f2f4; --m-mut:#8c8c96; --m-dim:#5d5d66; --m-acc:#9b7ae6; --m-acc-soft:#2a2340; --m-warn:#e2a33d;\n  --font:\"Noto Sans KR\",\"Pretendard\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:\"JetBrains Mono\",ui-monospace,Menlo,monospace;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--paper:#0f1215;--card:#171b20;--ink:#e8edf1;--muted:#9aa8b3;--line:#2b333b;--soft:#1e252c;--violet-soft:#241d36;--amber-soft:#2c2416;--teal-soft:#14302d;--rose-soft:#3a1d24;--violet-ink:#b9a0f0}}\n:root[data-theme=\"dark\"]{--paper:#0f1215;--card:#171b20;--ink:#e8edf1;--muted:#9aa8b3;--line:#2b333b;--soft:#1e252c;--violet-soft:#241d36;--amber-soft:#2c2416;--teal-soft:#14302d;--rose-soft:#3a1d24;--violet-ink:#b9a0f0}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;cursor:pointer;color:inherit}\nbutton:focus-visible{outline:3px solid #2c9cce;outline-offset:2px}\n.wrap{width:min(1320px,calc(100% - 32px));margin-inline:auto}\nh1,h2,h3{text-wrap:balance;letter-spacing:-.025em}\nheader.top{padding:40px 0 8px}\n.kick{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--violet-ink);text-transform:uppercase}\nheader.top h1{font-size:clamp(28px,3.6vw,42px);margin:8px 0 10px;line-height:1.15}\nheader.top p{margin:0;color:var(--muted);max-width:78ch}\n.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:22px}\n.rule{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}\n.rule b{display:block;font-size:15px;margin-bottom:4px}\n.rule span{font-size:13.5px;color:var(--muted)}\n.rule i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--violet-ink);font-weight:700}\n.sec{padding:34px 0 0}\n.sec h2{font-size:clamp(21px,2.2vw,26px);margin:0 0 4px}\n.sec>p{color:var(--muted);margin:0 0 14px;max-width:82ch}\n\n/* 값이 닿는 범위 */\n.scope{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto}\n.scope-grid{display:grid;grid-template-columns:170px repeat(6,minmax(118px,1fr));min-width:900px}\n.scope-grid>div{padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}\n.sh{font-size:11.5px!important;font-weight:800;color:var(--muted);background:var(--soft)}\n.sh small{display:block;font-weight:600;font-size:10.5px;color:var(--muted);opacity:.8}\n.sl{font-weight:800}\n.sl small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}\n.lane{position:relative;grid-column:2 / -1;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;padding:10px 0!important}\n.bar{height:28px;border-radius:8px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;font-weight:700;color:#fff;margin:0 6px;white-space:nowrap;overflow:hidden}\n.bar.v{background:var(--violet)}.bar.t{background:var(--teal)}.bar.a{background:var(--amber)}.bar.b{background:var(--blue)}\n.bar.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-weight:600}\n.lock{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,.25);font-size:11px}\n.cut{font-size:11px;color:var(--muted);font-weight:700;padding-left:8px;white-space:nowrap}\n.scope-note{padding:10px 14px;font-size:12.5px;color:var(--muted);margin:0}\n\n/* 흐름 */\n.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}\n.steps button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:700;color:var(--muted)}\n.steps button[aria-pressed=\"true\"]{background:var(--violet);border-color:var(--violet);color:#fff}\n.steps button.new{border-style:dashed}\n.steps button small{font-weight:800;font-size:10px;color:var(--amber);margin-left:4px}\n.steps button[aria-pressed=\"true\"] small{color:#ffe2a8}\n.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}\n@media (max-width:1050px){.layout{grid-template-columns:1fr}}\n.notes{display:grid;gap:12px;position:sticky;top:12px}\n.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}\n.note h3{margin:0 0 6px;font-size:14px}\n.note p{margin:0;font-size:13.5px;color:var(--muted)}\n.note ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}\n.note li+li{margin-top:4px}\n.note.dev{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 30%,var(--line))}\n.note.dev h3{color:var(--amber)}\n.note.flow h3{color:var(--violet-ink)}\n.legend-diff{font-size:12px;color:var(--muted);margin:8px 0 0;display:flex;align-items:center;gap:8px}\n.legend-diff i{width:22px;height:12px;border:2px dashed var(--m-warn);border-radius:4px;display:inline-block}\n\n/* ── 목업 ── */\n.device{position:relative;background:var(--m-bg);border-radius:16px;border:1px solid #000;box-shadow:0 18px 40px rgba(10,20,30,.22);overflow:hidden;color:var(--m-ink);font-size:13px}\n.d-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--m-line);font-weight:800;font-size:13px}\n.d-bar .crumbs{display:flex;gap:8px;align-items:center;margin-left:auto;color:var(--m-dim);font-weight:600;font-size:11.5px;flex-wrap:wrap}\n.d-bar .crumbs b{color:var(--m-ink)}\n.wiz{max-width:640px;margin:0 auto;padding:30px 22px 28px;min-height:540px}\n.wiz h4{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}\n.wiz .sub{color:var(--m-mut);margin:0 0 18px;font-size:12.5px}\n.q{border:1px solid var(--m-line);background:var(--m-panel);border-radius:12px;padding:12px 14px;margin-bottom:10px}\n.q-t{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:13.5px;margin-bottom:9px;align-items:center}\n.q-t small{font-weight:500;color:var(--m-dim);font-size:11.5px}\n.lockb{font-size:10.5px;font-weight:800;color:#f3c77a;border:1px solid #5a4520;background:#2a2112;border-radius:99px;padding:1px 8px;white-space:nowrap}\n.pass{font-size:10.5px;font-weight:800;color:#b9a3f2;border:1px solid #3c3160;background:#1d1830;border-radius:99px;padding:1px 8px;white-space:nowrap}\n.opts{display:flex;flex-wrap:wrap;gap:6px}\n.opt{border:1px solid var(--m-line);background:var(--m-card);border-radius:9px;padding:6px 11px;font-size:12.5px;color:var(--m-ink);display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.3}\n.opt small{color:var(--m-dim);font-size:10.5px}\n.opt.on{border-color:var(--m-acc);background:var(--m-acc-soft)}\n.opt .rec{font-size:9.5px;color:var(--m-acc);font-weight:800}\n.ratio{display:inline-block;border:1.5px solid currentColor;border-radius:2px;margin-bottom:3px;opacity:.75}\n.ta{border:1px solid var(--m-line);background:var(--m-panel);border-radius:12px;padding:12px 14px;min-height:78px;color:var(--m-ink);font-size:13px;margin-bottom:8px}\n.up{display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--m-line);border-radius:12px;padding:10px 14px;color:var(--m-mut);font-size:12px;margin-bottom:14px}\n.btn{border:1px solid var(--m-line);background:var(--m-card);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--m-ink)}\n.btn.pri{background:#f2f2f4;color:#111;border-color:#f2f2f4}\n.btn.acc{background:var(--m-acc);border-color:var(--m-acc);color:#fff}\n.btn.warn{background:#3a2a10;border-color:#6a4b1a;color:#f3c77a}\n.btn[disabled]{opacity:.4;cursor:not-allowed}\n.wiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px}\n.ghost{background:transparent;border:0;color:var(--m-mut);font-size:12.5px}\n.hint{font-size:11.5px;color:var(--m-mut);border-left:2px solid var(--m-acc);padding:4px 10px;margin:10px 0 0;background:#141320}\n.rec-banner{display:flex;gap:8px;align-items:center;font-size:11.5px;color:#cdbdf5;background:var(--m-acc-soft);border:1px solid #3c3160;border-radius:9px;padding:7px 10px;margin-bottom:10px}\n\n.studio{display:grid;grid-template-columns:58px minmax(0,1fr) 250px;min-height:580px}\n@media (max-width:760px){.studio{grid-template-columns:1fr}.rail,.chat{display:none}}\n.rail{border-right:1px solid var(--m-line);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:14px;color:var(--m-dim);font-size:9.5px}\n.rail span{display:grid;place-items:center;gap:2px;text-align:center}\n.rail span.on{color:var(--m-ink)}\n.rail i{width:20px;height:20px;border-radius:6px;background:#222226;display:block}\n.rail span.on i{background:var(--m-acc)}\n.rail span.lk i{background:#2a2112;outline:1px solid #5a4520}\n.rail span.moved{outline:2px dashed var(--m-warn);outline-offset:3px;border-radius:6px}\n.main{padding:16px 18px 20px;min-width:0}\n.title-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}\n.title-row h5{margin:0;font-size:17px}\n.meta{color:var(--m-dim);font-size:11.5px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.sect{margin-bottom:14px}\n.sect-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:7px;flex-wrap:wrap}\n.sect-h small{color:var(--m-dim);font-weight:600}\n.sect-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}\n.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--m-line);background:var(--m-card);border-radius:99px;padding:4px 10px 4px 4px;font-size:12px;margin:0 5px 5px 0}\n.pill i{width:20px;height:20px;border-radius:99px;background:#26262b;display:grid;place-items:center;font-style:normal;font-size:10px}\n.prose{border:1px solid var(--m-line);background:var(--m-panel);border-radius:12px;overflow:hidden}\n.prose-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--m-line)}\n.rt{font-family:var(--mono);font-size:11.5px;color:#cdbdf5;background:var(--m-acc-soft);border-radius:6px;padding:2px 7px}\n.tagc{font-size:11.5px;color:var(--m-mut);border:1px solid var(--m-line);border-radius:6px;padding:2px 7px;background:var(--m-card)}\n.tools{margin-left:auto;display:flex;gap:6px}\n.prose-b{padding:12px 14px;display:grid;gap:8px;font-size:12.5px;line-height:1.75;color:#d6d6dc}\n.prose-b p{margin:0;display:grid;grid-template-columns:26px 1fr;gap:6px}\n.prose-b p span:first-child{font-family:var(--mono);font-size:10.5px;color:var(--m-dim);padding-top:3px}\n.chat{border-left:1px solid var(--m-line);background:var(--m-panel);display:flex;flex-direction:column}\n.chat-h{padding:12px 14px;border-bottom:1px solid var(--m-line);font-weight:800;font-size:12.5px}\n.chat-h small{display:block;font-weight:500;color:var(--m-dim);font-size:10.5px}\n.chat-b{flex:1;padding:12px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}\n.msg{background:var(--m-card);border:1px solid var(--m-line);border-radius:10px;padding:9px 10px;font-size:12px;color:#d6d6dc;line-height:1.6}\n.msg b{color:var(--m-acc);font-size:11px;display:block}\n.msg.me{background:#2a2a30;align-self:flex-end;max-width:85%}\n.card-q{border:1px solid #3c3160;background:#16131f;border-radius:10px;padding:10px;display:grid;gap:7px}\n.card-q .qt{font-size:12px;font-weight:700}\n.card-q .row{display:grid;gap:4px}\n.card-q .row>small{color:var(--m-dim);font-size:10.5px}\n.card-q .opts .opt{padding:4px 8px;font-size:11.5px}\n.chat-in{margin:10px;border:1px solid var(--m-line);border-radius:10px;padding:9px 10px;color:var(--m-dim);font-size:11.5px}\n.diff{outline:2px dashed var(--m-warn);outline-offset:3px;border-radius:8px}\n\n/* 인물·배경·스타일 */\n.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--m-line);margin:2px 0 14px}\n.subtabs span{padding:7px 10px;font-size:12px;font-weight:700;color:var(--m-dim);border-bottom:2px solid transparent}\n.subtabs span.on{color:var(--m-ink);border-color:var(--m-acc)}\n.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}\n.asset{border:1px solid var(--m-line);background:var(--m-card);border-radius:12px;overflow:hidden;position:relative}\n.asset .ph{aspect-ratio:16/10;display:grid;place-items:center;font-weight:800;font-size:22px;color:rgba(255,255,255,.85)}\n.asset .ph.empty{background:repeating-linear-gradient(45deg,#16161a 0 8px,#1b1b20 8px 16px);color:var(--m-dim);font-size:11.5px;font-weight:600}\n.asset .ph.s1{background:radial-gradient(circle at 50% 38%,#9aa0a8 0 16%,transparent 17%),radial-gradient(ellipse at 50% 92%,#7d838c 0 34%,transparent 35%),linear-gradient(160deg,#454b54,#1c1f24)}\n.asset .ph.s1.bg{background:linear-gradient(180deg,#5a6069 0 45%,#30353c 45% 100%),#2a2e34}\n.asset .ph.s2{background:radial-gradient(circle at 50% 38%,#ffd8c2 0 16%,transparent 17%),radial-gradient(ellipse at 50% 92%,#6f8cff 0 34%,transparent 35%),linear-gradient(160deg,#ffb4a2,#8aa6ff)}\n.asset .ph.s2.bg{background:linear-gradient(180deg,#9ec5ff 0 45%,#ffc98f 45% 100%)}\n.asset .ph.busy{background:linear-gradient(90deg,#1b1b20,#26262c,#1b1b20);background-size:200% 100%;animation:sh 1.4s linear infinite;color:var(--m-mut);font-size:11.5px;font-weight:600}\n@keyframes sh{to{background-position:-200% 0}}\n@media (prefers-reduced-motion:reduce){.asset .ph.busy{animation:none}}\n.asset .cap{padding:8px 10px;display:grid;gap:2px}\n.asset .cap b{font-size:12.5px}\n.asset .cap small{color:var(--m-dim);font-size:10.5px;line-height:1.4}\n.asset .vtag{position:absolute;top:7px;left:7px;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;background:rgba(0,0,0,.55);color:#fff}\n.asset .vtag.old{background:#3a2a10;color:#f3c77a;border:1px solid #6a4b1a}\n.asset .chk{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:5px;border:1.5px solid #fff;background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:11px}\n.asset .chk.on{background:var(--m-acc);border-color:var(--m-acc)}\n.asset.add{display:grid;place-items:center;min-height:150px;border-style:dashed;color:var(--m-mut);font-size:12px}\n.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}\n.sty{border:1px solid var(--m-line);background:var(--m-card);border-radius:10px;overflow:hidden;text-align:left;padding:0}\n.sty .sw{height:46px}\n.sty span{display:block;padding:6px 8px;font-size:11.5px;font-weight:700}\n.sty span small{display:block;font-weight:500;color:var(--m-dim);font-size:10px}\n.sty.on{border-color:var(--m-acc);box-shadow:0 0 0 2px var(--m-acc-soft)}\n.stybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--m-line);background:var(--m-panel);border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:12px}\n.stybar .sw{width:28px;height:18px;border-radius:4px}\n.stybar .ver{font-family:var(--mono);font-size:11px;color:#cdbdf5;background:var(--m-acc-soft);border-radius:5px;padding:1px 6px}\n.stybar .right{margin-left:auto;display:flex;gap:6px}\n.est{font-size:11.5px;color:var(--m-mut)}\n.foot-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--m-line);padding-top:12px}\n\n/* 모달 */\n.modal-back{position:absolute;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:5;padding:16px}\n.modal{width:min(460px,100%);background:#151518;border:1px solid var(--m-line);border-radius:14px;padding:18px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.5)}\n.modal h6{margin:0;font-size:16px}\n.modal p{margin:0;color:var(--m-mut);font-size:12.5px;line-height:1.65}\n.modal .list{display:grid;gap:6px;border:1px solid var(--m-line);border-radius:10px;padding:10px 12px;background:var(--m-panel)}\n.modal .list div{display:flex;justify-content:space-between;gap:10px;font-size:12px}\n.modal .list div span:first-child{color:var(--m-mut)}\n.modal .acts{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}\n.vers{display:flex;gap:6px;flex-wrap:wrap}\n.vers span{font-size:11.5px;border:1px solid var(--m-line);border-radius:8px;padding:4px 8px;background:var(--m-card)}\n.vers span.cur{border-color:var(--m-acc);color:#cdbdf5}\n\n/* Director */\n.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}\n.frame{border:1px solid var(--m-line);border-radius:10px;overflow:hidden;background:var(--m-card)}\n.frame .ph{aspect-ratio:9/16;max-height:170px;width:100%;display:grid;place-items:center;font-size:11px;color:var(--m-dim)}\n.frame .cap{padding:6px 8px;font-size:11px;color:var(--m-mut)}\n.banner{display:flex;gap:10px;align-items:center;border:1px solid #5a4520;background:#221a0d;color:#f3c77a;border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:12px;flex-wrap:wrap}\n.banner.ok{border-color:#3c3160;background:#16131f;color:#cdbdf5}\n.banner .right{margin-left:auto;display:flex;gap:6px}\n\n/* 표 */\n.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto}\ntable{border-collapse:collapse;width:100%;min-width:820px;font-size:13.5px}\nth,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}\nthead th{font-size:12px;color:var(--muted);font-weight:800;background:var(--soft)}\ntd b{font-weight:800}\n.st{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;white-space:nowrap}\n.st.mv{background:var(--violet-soft);color:var(--violet-ink)}\n.st.rm{background:var(--rose-soft);color:var(--rose)}\n.st.kp{background:var(--teal-soft);color:var(--teal)}\n.st.nw{background:var(--amber-soft);color:var(--amber)}\n.st.lk{background:var(--amber-soft);color:var(--amber)}\n.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}\n.decide{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}\n.decide .note b{display:block;margin-bottom:4px}\n.foot{padding:30px 0 50px;color:var(--muted);font-size:12.5px}\n\n.writer-run{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid #2b3c55;background:#121a26;color:#9fc0ea;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:12px}\n.writer-run b{color:#cfe1fa}\n.writer-run .right{margin-left:auto}\n.spin{width:12px;height:12px;border-radius:50%;border:2px solid #4888d9;border-top-color:transparent;animation:rot 1s linear infinite;flex:none}\n@keyframes rot{to{transform:rotate(360deg)}}\n@media (prefers-reduced-motion:reduce){.spin{animation:none}}\n.rail span{position:relative}\n.rail span.run i{background:#1f3350;outline:1px dashed #4888d9}\n.rundot{position:absolute;top:-2px;right:6px;width:7px;height:7px;border-radius:50%;background:#4888d9}\n.gchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;border:1px solid var(--m-line);border-radius:99px;padding:2px 8px;color:var(--m-mut);background:var(--m-panel);margin-top:6px;width:max-content}\n.gchip.set{color:#f3c77a;border-color:#5a4520;background:#2a2112}\n.asset .ph.horror{filter:hue-rotate(160deg) saturate(.6) brightness(.7)}\n.lockbox{border:1px solid #5a4520;background:#1d170d;border-radius:12px;padding:10px 12px 2px;margin-bottom:10px}\n.prosebox{border:1px solid #3c3160;background:#16131f;border-radius:12px;padding:10px 12px 2px}\n.lockbox h6,.prosebox h6{margin:0 0 8px;font-size:12px;font-weight:800}\n.lockbox h6{color:#f3c77a}\n.prosebox h6{color:#cdbdf5}\n.rtbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border:1px solid var(--m-line);background:var(--m-panel);border-radius:12px;padding:10px 14px;margin-bottom:12px}\n.rtbig b{font-family:var(--mono);font-size:22px;color:#cdbdf5}\n.rtbig small{color:var(--m-dim);font-size:11.5px;flex-basis:100%}\n.shotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}\n.shot{border:1px solid var(--m-line);border-radius:10px;overflow:hidden;background:var(--m-card);padding:0;text-align:left;color:var(--m-ink)}\n.shot .fr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#0f0f12}\n.shot .fr i{display:block;aspect-ratio:9/16;max-height:72px;background:repeating-linear-gradient(45deg,#1b1b20 0 6px,#222228 6px 12px)}\n.shot .cap{padding:6px 8px;font-size:11px;color:var(--m-mut);display:flex;justify-content:space-between;gap:6px}\n.optpanel{border:1px solid var(--m-line);background:var(--m-panel);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:grid;gap:8px}\n.dl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}\n.modal .list div{align-items:center}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"top wrap\">\n  \u003cdiv class=\"kick\">Tale Studio · 화면 흐름 제안 · 기초 세팅 B안 + 파이프라인 A안\u003c/div>\n  \u003ch1>시작부터 Writer까지 화면 흐름\u003c/h1>\n  \u003cp>기초 세팅에서 잠글 값과 산문용 값을 나누고, Producer는 산문만 다룹니다. 산문을 확정하면 Artist 화면이 먼저 열려 스타일을 정하고 인물·배경 그림을 만들고, 그동안 Writer는 뒤에서 씬·샷을 나눕니다.\u003c/p>\n  \u003cdiv class=\"rules\">\n    \u003cdiv class=\"rule\">\u003ci>원칙 1\u003c/i>\u003cb>잠글 값과 산문용 값을 나눈다\u003c/b>\u003cspan>작업 언어·화면 비율은 기초 세팅에서 잠그고, 장르·톤·길이·AI 개입 정도는 산문에만 쓰고 산문 확정에서 끊어요.\u003c/span>\u003c/div>\n    \u003cdiv class=\"rule\">\u003ci>원칙 2\u003c/i>\u003cb>Artist가 먼저, Writer는 뒤에서\u003c/b>\u003cspan>산문을 넘기면 Artist 화면이 먼저 열려요. 스타일은 Artist에서 정하면 잠기고, 장르·톤은 인물·배경·씬마다 따로 줄 수 있어요.\u003c/span>\u003c/div>\n    \u003cdiv class=\"rule\">\u003ci>원칙 3\u003c/i>\u003cb>Writer는 보여주고 고르게\u003c/b>\u003cspan>총 러닝타임은 고치는 칸이 아니라 \"이 정도 나와요\"로 보여줘요. 대사 언어는 옵션에서 바꾸고, 대사마다 따로 바꿔 섞을 수 있어요.\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain class=\"wrap\">\n\n  \u003csection class=\"sec\" aria-labelledby=\"scope-h\">\n    \u003ch2 id=\"scope-h\">값이 어디까지 닿는가\u003c/h2>\n    \u003cp>막대가 끝나는 곳에서 그 값의 영향이 끝납니다. 뒤 단계는 받은 값을 자기 것으로 쓰고, 앞 단계로 거슬러 올라가 맞추지 않습니다.\u003c/p>\n    \u003cdiv class=\"scope\">\u003cdiv class=\"scope-grid\">\n      \u003cdiv class=\"sh\">값\u003c/div>\n      \u003cdiv class=\"sh\">기초 세팅\u003c/div>\n      \u003cdiv class=\"sh\">Producer 산문\u003c/div>\n      \u003cdiv class=\"sh\">산문 확정\u003csmall>넘기기 · Producer 잠금\u003c/small>\u003c/div>\n      \u003cdiv class=\"sh\">Artist\u003csmall>먼저 열림\u003c/small>\u003c/div>\n      \u003cdiv class=\"sh\">Writer\u003csmall>뒤에서 씬·샷\u003c/small>\u003c/div>\n      \u003cdiv class=\"sh\">Director\u003c/div>\n\n      \u003cdiv class=\"sl\">작업 언어\u003c/div>\n      \u003cdiv class=\"lane\">\u003cdiv class=\"bar a\" style=\"grid-column:1 / 7\">\u003cspan class=\"lock\">🔒\u003c/span>기초 세팅에서 잠금 · 끝까지 같음\u003c/div>\u003c/div>\n      \u003cdiv class=\"sl\">화면 비율\u003c/div>\n      \u003cdiv class=\"lane\">\u003cdiv class=\"bar a\" style=\"grid-column:1 / 7\">\u003cspan class=\"lock\">🔒\u003c/span>기초 세팅에서 잠금 · 끝까지 같음\u003c/div>\u003c/div>\n      \u003cdiv class=\"sl\">장르·톤 \u003csmall>산문용\u003c/small>\u003c/div>\n      \u003cdiv class=\"lane\">\u003cdiv class=\"bar v\" style=\"grid-column:1 / 3\">추천 → 다시 쓰기 조건\u003c/div>\u003cdiv class=\"cut\" style=\"grid-column:3 / 7\">✂ 산문 확정에서 끊김 · Artist의 장르·톤과 따로\u003c/div>\u003c/div>\n      \u003cdiv class=\"sl\">길이 \u003csmall>산문용\u003c/small>\u003c/div>\n      \u003cdiv class=\"lane\">\u003cdiv class=\"bar v\" style=\"grid-column:1 / 3\">범위 → 다시 쓰기 조건\u003c/div>\u003cdiv class=\"cut\" style=\"grid-column:3 / 7\">✂ 산문 확정에서 끊김\u003c/div>\u003c/div>\n      \u003cdiv class=\"sl\">AI 개입 정도 \u003csmall>산문용\u003c/small>\u003c/div>\n      \u003cdiv class=\"lane\">\u003cdiv class=\"bar v\" style=\"grid-column:1 / 3\">자료와 함께 → 다시 쓰기 \"얼마나\"\u003c/div>\u003cdiv class=\"cut\" style=\"grid-column:3 / 7\">✂ 산문 확정에서 끊김\u003c/div>\u003c/div>\n      \u003cdiv class=\"sl\">스타일\u003c/div>\n      \u003cdiv class=\"lane\">\u003cdiv class=\"bar b\" style=\"grid-column:4 / 5\">\u003cspan class=\"lock\">🔒\u003c/span>Artist에서 정하고 잠금\u003c/div>\u003cdiv class=\"bar b\" style=\"grid-column:5 / 7;opacity:.75\">바꾸면 리셋 (Artist부터 다시)\u003c/div>\u003c/div>\n      \u003cdiv class=\"sl\">장르·톤 \u003csmall>객체마다\u003c/small>\u003c/div>\n      \u003cdiv class=\"lane\">\u003cdiv class=\"bar t\" style=\"grid-column:4 / 5\">인물·배경마다\u003c/div>\u003cdiv class=\"bar ghost\" style=\"grid-column:6 / 7\">씬마다? (확인 필요)\u003c/div>\u003c/div>\n      \u003cdiv class=\"sl\">총 러닝타임\u003c/div>\n      \u003cdiv class=\"lane\">\u003cdiv class=\"bar t\" style=\"grid-column:5 / 6\">샷 길이 합 · 보여주기만\u003c/div>\u003c/div>\n      \u003cdiv class=\"sl\">대사 언어\u003c/div>\n      \u003cdiv class=\"lane\">\u003cdiv class=\"bar t\" style=\"grid-column:5 / 6\">옵션 · 대사마다 한/영\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"scope-note\">장르·톤은 부모·자식으로 물려받지 않고, 인물·배경·씬 이미지 하나하나에 따로 적용됩니다(예: 스타일은 애니인데 이 인물만 호러).\u003c/p>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sec\" aria-labelledby=\"flow-h\">\n    \u003ch2 id=\"flow-h\">화면 흐름\u003c/h2>\n    \u003cp>단계를 누르거나 화면 안 버튼을 눌러 넘겨 보세요. 점선 테두리는 지금 제품과 달라지는 곳입니다.\u003c/p>\n    \u003cdiv class=\"steps\" id=\"steps\">\u003c/div>\n    \u003cdiv class=\"layout\">\n      \u003cdiv>\u003cdiv class=\"device\" id=\"device\">\u003c/div>\u003cp class=\"legend-diff\">\u003ci>\u003c/i>지금 제품과 달라지는 곳\u003c/p>\u003c/div>\n      \u003caside class=\"notes\" id=\"notes\" aria-live=\"polite\">\u003c/aside>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sec\" aria-labelledby=\"where-h\">\n    \u003ch2 id=\"where-h\">기능이 가는 곳\u003c/h2>\n    \u003cp>지금 제품과 비교해 어디로 옮기고, 무엇을 잠그고, 무엇을 빼는지 정리했습니다.\u003c/p>\n    \u003cdiv class=\"tbl-wrap\">\u003ctable>\n      \u003cthead>\u003ctr>\u003cth style=\"width:170px\">기능\u003c/th>\u003cth style=\"width:90px\">처리\u003c/th>\u003cth>어디서, 어떻게\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>\u003cb>작업 언어\u003c/b>\u003cbr>\u003csmall>지금 이름: 채팅 언어\u003c/small>\u003c/td>\u003ctd>\u003cspan class=\"st lk\">잠금\u003c/span>\u003c/td>\u003ctd>기초 세팅의 \"잠기는 값\"에서 확인하고 잠가요. 기본값은 사이트 언어예요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>화면 비율\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st lk\">잠금\u003c/span>\u003c/td>\u003ctd>기초 세팅의 \"잠기는 값\"에서 확인하고 잠가요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>장르·톤 (산문용)\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st mv\">바뀜\u003c/span>\u003c/td>\u003ctd>기초 세팅의 \"산문 조건\"에서 추천받고, Producer에서는 다시 쓰기 조건으로만 바꿔요. 산문 확정에서 끊겨요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>길이 (산문용)\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st mv\">바뀜\u003c/span>\u003c/td>\u003ctd>기초 세팅의 \"산문 조건\"에서 범위로 고르고, 다시 쓰기로만 바꿔요. 산문 확정에서 끊겨요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>AI 개입 정도\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st nw\">새로\u003c/span>\u003c/td>\u003ctd>자료를 넣을 때 고르고, 다시 쓰기의 \"얼마나\"와 같은 말을 써요. 지금의 \"쓰임새(대본 그대로 · 다듬어서 · 아이디어)\"를 넓힌 거예요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>인물·배경 목록\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st mv\">이동\u003c/span>\u003c/td>\u003ctd>Producer의 Casting · Background를 빼고, Artist가 확정 산문에서 뽑아요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>스타일\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st mv\">이동 · 잠금\u003c/span>\u003c/td>\u003ctd>Producer에서 빼고 Artist에서 정해요. 정하면 잠기고, Artist에서든 Director에서든 바꾸면 리셋돼서 그림을 다시 만들어요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>장르·톤 (객체마다)\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st nw\">새로\u003c/span>\u003c/td>\u003ctd>Artist에서 인물·배경 카드마다 줄 수 있어요. 그 객체만 다시 만들어요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>총 러닝타임\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st mv\">바뀜\u003c/span>\u003c/td>\u003ctd>Writer 씬·샷 화면 위쪽에 샷 길이의 합으로 보여줘요. 고치는 칸이 아니라 \"이 정도 나와요\" 안내예요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>대사 언어\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st mv\">이동\u003c/span>\u003c/td>\u003ctd>Producer에서 빼고 Writer 옵션에서 바꿔요. 대사마다 따로 바꿔서 한국어·영어를 섞을 수 있어요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>\"무엇을 만들고 싶으세요\"\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st rm\">삭제\u003c/span>\u003c/td>\u003ctd>추천이 채워진 기초 세팅으로 바뀌어요.\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>\u003cb>제목 아래 설정 칩\u003c/b>\u003c/td>\u003ctd>\u003cspan class=\"st rm\">삭제\u003c/span>\u003c/td>\u003ctd>산문 머리에 예상 시간과 장르만 보여줘요.\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\u003c/div>\n  \u003c/section>\n\n  \u003csection class=\"sec\" aria-labelledby=\"dec-h\">\n    \u003ch2 id=\"dec-h\">남은 결정과 개발 확인\u003c/h2>\n    \u003cdiv class=\"decide\">\n      \u003cdiv class=\"note\">\u003cb>Director에서 장르·톤\u003c/b>\u003cp>씬·샷 이미지마다 장르·톤을 Director에서도 줄 수 있게 할지, Artist에서만 줄지 정해야 해요. 범위표에는 \"확인 필요\"로 남겨 뒀어요.\u003c/p>\u003c/div>\n      \u003cdiv class=\"note dev\">\u003ch3>개발 확인 1 · 순서\u003c/h3>\u003cp>지금은 Writer 06·07(그림 쪽)이 01~03(이야기 쪽) 결과를 받아 써요. Artist를 먼저 띄우고 Writer를 뒤에서 돌리려면, 인물·배경 디자인이 확정 산문만으로 돌 수 있어야 해요.\u003c/p>\u003c/div>\n      \u003cdiv class=\"note dev\">\u003ch3>개발 확인 2 · 스타일과 장르·톤\u003c/h3>\u003cp>스타일을 잠그고 바꿀 때 리셋하는 방식, 그리고 장르·톤을 이미지 객체마다 저장해 그 객체만 다시 만들 수 있는지요.\u003c/p>\u003c/div>\n      \u003cdiv class=\"note dev\">\u003ch3>개발 확인 3 · 러닝타임과 대사\u003c/h3>\u003cp>넘기기 때 러닝타임 일치 검사를 빼도 되는지, 총 러닝타임을 샷 길이 합으로 보여줄 수 있는지, 대사 언어를 대사마다 저장할 수 있는지요.\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cp class=\"foot\">기준: Tale Studio 실제 화면(새 프로젝트, Producer Meeting Room, 다시 쓰기 카드) 2026-10-12 확인 · Producer · Writer 단계별 산출물(제안 A 다시 쓰기로만 바꿔요.'], dev: '' },\n    S3: { flow: '제목 아래 설정 칩, Casting · Background가 없어요. 산문 머리에 예상 시간과 장르만 보여요.', why: ['길이·장르·톤·개입 정도는 다시 쓰기 카드의 조건이에요. 설정과 산문이 따로 놀 수 없어요.', '인물·배경과 스타일은 Artist에서 정해요.'], dev: '' },\n    S4: { flow: '넘기기 전에 무엇이 넘어가고, 무엇이 여기서 끝나는지 보여줘요.', why: ['산문 조건은 여기서 끊겨요. 뒤 단계는 확정 산문만 받아요.', '다음 화면은 Artist예요. Writer는 뒤에서 씬·샷을 나눠요.'], dev: '넘기기 때 러닝타임 일치 검사를 빼도 되는지 확인이 필요해요.' },\n    A1: { flow: '산문을 넘기면 Artist가 먼저 열려요. 위쪽에 Writer 진행 상태가 보여요.', why: ['Writer의 씬·샷 나누기와 러프가 오래 걸리니, 그동안 사용자는 그림을 정해요.', '스타일은 고르는 순간 이 작품의 스타일로 잠겨요.'], dev: '인물·배경 디자인이 Writer 01~03 결과 없이 확정 산문만으로 돌 수 있는지 확인이 필요해요.' },\n    A2: { flow: '그림이 다 나온 모습이에요. 스타일 막대에 🔒가 붙고, 카드마다 \"장르·톤\" 칩이 있어요.', why: ['스타일은 작품 전체에 하나예요.', '장르·톤은 카드마다 따로예요. 부모·자식으로 물려받지 않아요.'], dev: '' },\n    A3: { flow: '카드의 장르·톤 칩을 누르면 그 객체에만 적용할 장르·톤을 골라요.', why: ['예: 스타일은 애니인데 이 인물만 호러, 이 씬만 코미디.', '그 객체 한 장만 다시 만들고, 나머지와 스타일은 그대로예요.'], dev: '장르·톤을 이미지 객체마다 저장하고 그 객체만 다시 만들 수 있는지 확인이 필요해요.' },\n    A3b: { flow: '민호에게만 호러를 적용한 결과예요. 민호 카드의 칩이 강조돼요.', why: ['팀장과 배경은 그대로예요.'], dev: '' },\n    A4: { flow: '잠긴 스타일을 바꾸려 하면 리셋 안내가 떠요.', why: ['Artist에서든 Director에서든 스타일을 바꾸면 리셋이에요. 그림을 모두 다시 만들어요.', '객체별 장르·톤은 유지해요.'], dev: '스타일 잠금과 리셋 범위(시트·배경·실사)를 어떻게 처리할지 확인이 필요해요.' },\n    W1: { flow: 'Writer 화면이에요. 위쪽에 총 러닝타임이 크게 보여요.', why: ['러닝타임은 고치는 칸이 아니라 샷 길이의 합으로 \"이 정도 나와요\"를 보여줘요.', '샷을 고치면 숫자도 같이 바뀌어요.', 'Artist 그림은 받지 않고 인물·배경 목록만 받아요.'], dev: '총 러닝타임을 샷 길이 합으로 계산해 보여줄 수 있는지 확인이 필요해요.' },\n    W1o: { flow: '옵션을 펼치면 대사 언어를 바꿀 수 있어요.', why: ['한국어 / English / 대사마다 따로 중에서 골라요.', '대사 언어는 처음에 묻지 않고 여기서 정해요.'], dev: '' },\n    W2: { flow: '샷 팝업에서 대사 줄마다 한/영을 고를 수 있어요.', why: ['한 샷 안에서 한국어 대사와 영어 대사를 섞을 수 있어요.', '바꾸면 그 대사만 다시 써요.'], dev: '대사 언어를 대사마다 저장할 수 있는지 확인이 필요해요. 지금은 프로젝트 전체에 하나예요.' },\n    D1: { flow: 'Director에서는 스타일이 잠겨 있다고 보여줘요.', why: ['여기서 바꾸면 리셋이라 Artist부터 다시 만들어요.', 'Director와 Artist는 서로 영향을 주고받아요.'], dev: '' }\n  };\n\n  var device = $('#device'), notes = $('#notes'), steps = $('#steps');\n  steps.innerHTML = FLOW.map(function (f) { return '\u003cbutton data-key=\"' + f[0] + '\" aria-pressed=\"false\" class=\"' + (f[2] ? 'new' : '') + '\">' + f[1] + (f[2] ? '\u003csmall>새로\u003c/small>' : '') + '\u003c/button>'; }).join('');\n  function show(key) {\n    device.innerHTML = SCREENS[key]();\n    $$('button', steps).forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.key === key)); });\n    var n = NOTES[key];\n    notes.innerHTML = '\u003cdiv class=\"note flow\">\u003ch3>이 화면\u003c/h3>\u003cp>' + n.flow + '\u003c/p>\u003c/div>' +\n      '\u003cdiv class=\"note\">\u003ch3>왜 이렇게\u003c/h3>\u003cul>' + n.why.map(function (w) { return '\u003cli>' + w + '\u003c/li>'; }).join('') + '\u003c/ul>\u003c/div>' +\n      (n.dev ? '\u003cdiv class=\"note dev\">\u003ch3>개발 확인\u003c/h3>\u003cp>' + n.dev + '\u003c/p>\u003c/div>' : '');\n  }\n  steps.addEventListener('click', function (e) { var b = e.target.closest('button[data-key]'); if (b) show(b.dataset.key); });\n  device.addEventListener('click', function (e) {\n    var go = e.target.closest('[data-go]'); if (go && !go.disabled) { show(go.dataset.go); return; }\n    var pick = e.target.closest('[data-pick]');\n    if (pick) { $$('.opt', pick.parentNode).forEach(function (o) { o.classList.toggle('on', o === pick); }); return; }\n    var s = e.target.closest('[data-pick-sty]');\n    if (s) { $$('.sty', s.parentNode).forEach(function (o) { o.classList.toggle('on', o === s); }); return; }\n    var t = e.target.closest('[data-tog]');\n    if (t) { $$('.opt', t.parentNode).forEach(function (o) { o.classList.toggle('on', o === t); }); }\n  });\n  show('S1');\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "pipeline": "\u003c!doctype html>\u003chtml>\u003chead>\u003cmeta charset=utf8>\u003cmeta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\u003cstyle>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}\u003c/style>\u003c/head>\u003cbody>\n\u003ctitle>Producer · Writer 단계별 산출물\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap\">\n\u003cstyle>\n/* 레이아웃: 네이비 머리 → 묶음 바로가기(고정) → 가로 단계 트랙(누르는 곳) → 바로 아래 상세 판.\n   팔레트는 참고 파일(Tale Studio 제작 파이프라인 지도)을 그대로 따른다. 한 가지 밝은 테마로 고정. */\n:root{\n  color-scheme: light;\n  --ink:#172839; --muted:#617286; --line:#dce5ec; --paper:#f3f6f8; --white:#ffffff; --navy:#0f2032;\n  --teal:#19a5a0; --teal-ink:#0c7984; --teal-btn:#117f83; --violet:#8c68d6; --blue:#4888d9;\n  --amber:#df9c2f; --rose:#d96982; --green:#2eaa84; --slate:#617286;\n  --grid:#edf3f7; --board:#fafcfd; --arrow:#9bafbb; --focus:#2c9cce; --soft:#f3f7f9; --soft-line:#dce7ed;\n  --shadow:0 14px 34px rgba(20,42,62,.08);\n  --font:\"Inter\",\"Pretendard\",\"Noto Sans KR\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}\nbody{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}\nbutton{font:inherit;cursor:pointer}\nbutton:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:3px}\n.wrap{width:min(1440px,calc(100% - 52px));margin-inline:auto}\nh1,h2,h3{text-wrap:balance}\n\n/* 머리 */\n.hero{background:radial-gradient(circle at 85% 18%,rgba(41,181,175,.23),transparent 26%),radial-gradient(circle at 12% 90%,rgba(142,104,214,.18),transparent 28%),var(--navy);color:#f8fbfc;padding-block:42px 28px;overflow:hidden}\n.hero-top{display:flex;justify-content:space-between;gap:30px;align-items:flex-start}\n.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#7ddbd2;font-weight:800}\n.hero h1{font-size:clamp(30px,4vw,50px);line-height:1.12;margin:12px 0;letter-spacing:-.04em}\n.hero p{color:#c8d5df;line-height:1.7;max-width:720px;margin:0;font-size:16px}\n.snapshot{border:1px solid #3d5364;background:#1d3244;border-radius:14px;padding:14px 18px;min-width:240px;font-size:12.5px;line-height:1.75;color:#c7d8e1;flex:none}\n.snapshot strong{color:#ffffff;display:block;font-size:13px}\n.hero-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}\n.stat{border:1px solid #3b5265;background:#1a3144;border-radius:14px;padding:12px 18px;min-width:150px}\n.stat b{display:block;font-size:25px;color:#ffffff;line-height:1.15}\n.stat span{color:#b7ccd9;font-size:12.5px}\n\n/* 묶음 바로가기 */\n.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(244,247,249,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}\n.navrow{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}\n.navrow button{display:flex;align-items:center;gap:8px;padding:14px 16px;white-space:nowrap;border:0;border-bottom:3px solid transparent;background:transparent;color:#4f6272;font-size:13px;font-weight:800}\n.navrow button:hover,.navrow button.active{color:var(--teal-ink);border-color:#21a8a2;background:#e8f4f3}\n.navrow .ndot{width:9px;height:9px;border-radius:99px;background:var(--c);flex:none}\n.navrow .ndot.dashed{background:transparent;border:1.5px dashed var(--c)}\n.navrow small{font-weight:700;color:#8296a5;font-size:11.5px}\n\nmain{padding-bottom:80px}\n.version-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding-top:14px;font-size:12px;color:#657b89;flex-wrap:wrap}\n.version-bar b{color:#2c4558}\n.section{padding-top:34px;scroll-margin-top:56px}\n.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px;flex-wrap:wrap}\n.section-kicker{font-size:11px;font-weight:800;color:#078c8b;letter-spacing:.12em;text-transform:uppercase}\n.section-head h2{font-size:clamp(24px,2.4vw,32px);letter-spacing:-.035em;margin:4px 0 0}\n.section-head p{color:var(--muted);margin:8px 0 0;font-size:14px;line-height:1.6}\n.section-action{display:flex;gap:8px}\n.ghost-btn,.solid-btn{border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px}\n.ghost-btn{background:#ffffff;border:1px solid var(--line);color:#31495e}\n.ghost-btn:hover:not(:disabled){border-color:#77bdbc;background:#f5fcfc}\n.solid-btn{background:var(--teal-btn);border:1px solid var(--teal-btn);color:#ffffff}\n.solid-btn:hover:not(:disabled){background:#0c666b}\n.ghost-btn:disabled,.solid-btn:disabled{opacity:.4;cursor:default}\n\n/* 범례 */\n.legend{display:flex;gap:16px;flex-wrap:wrap;color:#5f7484;font-size:12.5px;margin-bottom:12px}\n.legend span{display:flex;align-items:center;gap:7px}\n.legend i{width:22px;height:0;border-top:4px solid var(--c);border-radius:2px}\n.legend i.dashed{border-top:2px dashed var(--c)}\n\n/* 트랙 */\n.diagram-shell{position:relative;background:#ffffff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}\n.diagram-shell::before,.diagram-shell::after{content:'';position:absolute;top:0;bottom:0;width:44px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:3}\n.diagram-shell::before{left:0;background:linear-gradient(90deg,var(--board),rgba(250,252,253,0))}\n.diagram-shell::after{right:0;background:linear-gradient(270deg,var(--board),rgba(250,252,253,0))}\n.diagram-shell.more-left::before,.diagram-shell.more-right::after{opacity:1}\n.diagram-scroll{overflow-x:auto;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1 {padding:4px 16px 14px;font-size:12px;color:#7b8e9c;margin:0}\n@media (max-width:480px){.imp-detail{padding:14px 16px}}\n\n.modebar{display:flex;align-items:center;gap:6px;padding:10px 0 2px;flex-wrap:wrap}\n.modebar .mb-label{font-size:12px;font-weight:800;color:#5f7484;margin-right:2px}\n.modebar button{border:1px solid var(--line);background:#ffffff;color:#3d5265;border-radius:99px;padding:5px 13px;font-size:13px;font-weight:800}\n.modebar button:hover{border-color:#a48ae0}\n.modebar button[aria-pressed=\"true\"]{background:#6a49b8;border-color:#6a49b8;color:#ffffff}\n.modebar .mb-now{font-size:12px;color:#7b8e9c;margin-left:6px}\n.imp-node.proc{background:#f7f4fd}\n.imp-edge.pch{stroke:#6a49b8;opacity:.45}\n.imp-edge.pset{stroke:#b49be6;opacity:.5}\n.mx td.c.pd{color:#6a49b8}\n.group.prod .g-row + .g-row{margin-left:0}\n\n.modebar .mb-sep{width:1px;height:20px;background:var(--line);margin:0 6px}\n.imp-title{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #e9eef2;background:#fbfcfd}\n.imp-title b{font-size:14.5px;color:#2c4558}\n.imp-title span{font-size:12px;color:#7b8e9c}\n.imp-shell.imp-prop{border-color:#cbbdf0}\n.imp-shell.imp-prop .imp-title{background:#f6f2fd}\n.imp-shell.imp-prop .imp-title b{color:#6a49b8}\n#impGraphs{display:grid;gap:16px}\n#impGraphs>*,#impMatrices>*,.imp-shell{min-width:0}\n.imp-node.df-new,.imp-node.df-move,.imp-node.df-lock,.imp-node.df-cut{outline:2px dashed #e2a33d;outline-offset:2px}\n.imp-node.df-gone{border-style:dashed;background:#fbf7f8}\n.imp-node.df-gone strong{text-decoration:line-through;color:#8a6a74}\n.imp-node .mark{max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.imp-edge.copy{stroke:#b49be6;stroke-dasharray:4 4;opacity:.6}\n.imp-edge.moved{stroke:#c4566f;stroke-dasharray:6 4;opacity:.6}\n.cut-tag{position:absolute;z-index:3;font-size:11px;font-weight:800;color:#c4566f;background:#fdecee;border:1px solid #f3c3cd;border-radius:6px;padding:2 tat\">\u003cb>9\u003c/b>\u003cspan>Producer 값\u003c/span>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cb>15\u003c/b>\u003cspan>Writer 단계\u003c/span>\u003c/div>\n        \u003cdiv class=\"stat\">\u003cb>1\u003c/b>\u003cspan>사람이 확정하는 지점\u003c/span>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cb>2\u003c/b>\u003cspan>동시에 도는 갈래\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cnav class=\"topnav\" aria-label=\"묶음 바로가기\">\n  \u003cdiv class=\"wrap modebar\" role=\"group\" aria-label=\"보기 전환\">\u003cspan class=\"mb-label\">보기\u003c/span>\u003cbutton type=\"button\" data-mode=\"producer\" aria-pressed=\"false\">Producer만\u003c/button>\u003cbutton type=\"button\" data-mode=\"writer\" aria-pressed=\"false\">Writer만\u003c/button>\u003cbutton type=\"button\" data-mode=\"all\" aria-pressed=\"true\">Producer + Writer\u003c/button>\u003cspan class=\"mb-sep\">\u003c/span>\u003cspan class=\"mb-label\">버전\u003c/span>\u003cbutton type=\"button\" data-ver=\"cur\" aria-pressed=\"true\">기존\u003c/button>\u003cbutton type=\"button\" data-ver=\"prop\" aria-pressed=\"false\">제안(A안)\u003c/button>\u003cbutton type=\"button\" data-ver=\"compare\" aria-pressed=\"false\">기존 ↕ 제안 비교\u003c/button>\u003cspan class=\"mb-now\">지금: \u003cb id=\"modeNow\">Producer + Writer\u003c/b> · 그래프·표·단계 트랙이 함께 바뀌어요\u003c/span>\u003c/div>\n  \u003cdiv class=\"wrap navrow\" id=\"phaseNav\">\u003c/div>\n\u003c/nav>\n\n\u003cmain class=\"wrap\">\n  \u003cdiv class=\"version-bar\">\n    \u003cb>Producer · Writer · 코드 기준\u003c/b>\n    \u003cspan>타일을 누르거나, 타일을 고른 뒤 ← → 키로 옮겨 보세요. 주소 끝 #producer · #writer · #all 로 보기를 바로 열 수 있어요.\u003c/span>\n  \u003c/div>\n\n  \u003csection class=\"section\" id=\"impact\" aria-labelledby=\"impact-h\">\n    \u003cdiv class=\"section-head\">\n      \u003cdiv>\n        \u003cdiv class=\"section-kicker\">한눈에 · 입력 영향도\u003c/div>\n        \u003ch2 id=\"impact-h\">Producer 값이 어디까지 닿는지 · 기존과 제안\u003c/h2>\n        \u003cp>진한 보라는 Producer의 두 화면(P1 기초 세팅, P2 Producer 화면), 연한 보라는 거기서 정해 Writer로 넘기는 값입니다. 값은 아키텍처 지도 02(입력 영향도)를 따릅니다. 값을 누르면 그 값을 다루는 화면, 쓰는 Writer 단계, 이어서 바뀌는 다음 화면까지 표시됩니다. 제안(A안)에서 주황 값은 Artist에서, 파랑 값은 Writer에서 정하는 값입니다.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"section-action\">\n        \u003cbutton type=\"button\" class=\"ghost-btn\" id=\"impReset\">선택 해제\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"imp-legend\" id=\"impLegend\">\u003c/div>\n    \u003cdiv id=\"impGraphs\">\u003c/div>\n    \u003cdiv class=\"mx-key mx-key-top\">\u003cspan id=\"mxKeyP\">\u003cb style=\"color:#6a49b8\">●\u003c/b> 그 Producer 화면에서 이 값을 다룸\u003c/span>\u003cspan>\u003cb>●\u003c/b> Writer 단계가 값을 직접 씀\u003c/span>\u003cspan>\u003cem>●\u003c/em> 앞 단계 결과를 거쳐 영향을 받음\u003c/span>\u003cspan id=\"mxKeyProp\">\u003cb style=\"color:#b49be6\">◐\u003c/b> 처음값으로 한 번 넘김 · \u003cb style=\"color:#c4566f\">→\u003c/b> 옮겨 감 · \u003cb style=\"color:#c4566f\">✂\u003c/b> 여기서 끊김\u003c/span>\u003c/div>\n    \u003cdiv id=\"impMatrices\">\u003c/div>\n    \u003cp class=\"mx-note\">Writer 쪽 연결은 이 문서의 단계 설명과 아키텍처 지도 02를, 기존 Producer는 아키텍처 지도 02와 실제 화면(10/12)을, 제안(A안)은 10/13 회의 결정 사항을 기준으로 정리했습니다. 코드에서 한 번 더 확인이 필요합니다.\u003c/p>\n  \u003c/section>\n\n  \u003csection class=\"section\" id=\"flow\" aria-labelledby=\"flow-h\">\n    \u003cdiv class=\"section-head\">\n      \u003cdiv>\n        \u003cdiv class=\"section-kicker\">흐름\u003c/div>\n        \u003ch2 id=\"flow-h\">과정·단계를 눌러 보세요\u003c/h2>\n        \u003cp>왼쪽에서 오른쪽으로 진행합니다. 옆으로 밀거나 오른쪽 버튼으로 넘겨 보세요.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"section-action\">\n        \u003cbutton type=\"button\" class=\"ghost-btn\" id=\"scrollPrev\" aria-label=\"트랙을 왼쪽으로\">←\u003c/button>\n        \u003cbutton type=\"button\" class=\"ghost-btn\" id=\"scrollNext\" aria-label=\"트랙을 오른쪽으로\">→\u003c/button>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"legend\" id=\"legend\">\u003c/div>\n\n    \u003cdiv class=\"diagram-shell\" id=\"shell\">\n      \u003cdiv class=\"diagram-scroll\" id=\"trackScroll\">\n        \u003cdiv class=\"track\" id=\"track\" role=\"tablist\" aria-label=\"과정·단계\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n\n    \u003csection class=\"detail\" id=\"detail\" role=\"tabpanel\" aria-label=\"고른 단계의 상세\">\u003c/section>\n  \u003c/section>\n\n  \u003cfooter class=\"foot\">\n    \u003cp>기본 Writer 엔진 기준입니다. 관리자용 V2 엔진은 흐름이 달라 이 지도에 없습니다. Producer는 P1 기초 세팅, P2 Producer 화면 두 곳으로 나눴습니다.\u003c/p>\n    \u003cp>단계 옆의 작은 영문 표기(s1, v0 등)는 개발자용 흐름도에서 같은 단계를 찾을 때 쓰는 이름입니다.\u003c/p>\n  \u003c/footer>\n\u003c/main>\n\n\u003cscript>\n(function () {\n  // 묶음: 트랙 색과 바로가기의 단위. 바깥(Producer·하류)은 참고 파일의 단계 색을 쓴다.\n  var PH = {\n    'in':  { label: 'Producer에서 받는 것', track: '받는 것', nav: '받는 것', range: '바깥', color: '#8c68d6' },\n    prod:  { label: 'Producer', nav: 'Producer', range: 'P1~P2', color: '#6a49b8', hint: '기초 세팅 → Producer 화면' },\n    story: { label: '이야기 짜기', nav: '이야기 짜기', range: '01~04', color: '#4888d9' },\n    gate:  { label: '사람이 확정', nav: '확정', range: '멈춤', color: '#617286', dashed: true },\n    look:  { label: '보이는 모습 정하기', nav: '보이는 모습', range: '05~07', color: '#df9c2f' },\n    scene: { label: '씬 촬영 설계', nav: '씬 촬영 설계', range: '08~10', color: '#19a5a0' },\n    shot:  { label: '샷 완성', nav: '샷 완성', range: '11~14', color: '#d96982', hint: '위 그림 갈래 · 아래 대사 갈래, 동시에' },\n    save:  { label: '저장', nav: '저장', range: '15', color: '#2eaa84' },\n    out:   { label: 'Writer 다음', nav: '다음', range: '바깥', color: '#617286' },\n    tow:   { label: 'Writer로 이어짐', nav: 'Writer로', range: '바깥', color: '#4888d9' }\n  };\n\n  // 단계 내용: 코드(steps.ts 등) 기준. items = [이름, 풀이].\n  var N = {\n    'in': { phase: 'in', num: '바깥', name: 'Producer에서 받는 것', gist: 'Writer가 받는 재료',\n      does: 'Writer가 만들지 않고, Producer에서 확정돼 넘어오는 재료입니다. Writer는 이 재료로 01부터 시작합니다.',\n      itemsQuad: '재료', itemsTitle: '넘어오는 것',\n      items: [\n        ['장르·톤·목표 감정', ''],\n        ['화면비·러닝타임·깊이(D1~D7)', '러닝타임과 깊이가 씬 수와 샷 수의 규모를 정합니다.'],\n        ['인물 목록', '이름·역할·외형입니다.'],\n        ['배경 목록', '장소 이름과 설명입니다.'],\n        ['그림체 견본', '골랐을 때만 넘어옵니다. 있으면 05에서 매체와 화풍을 견본에 맞춥니다.'],\n        ['이야기 원문 또는 대본', '대본을 넣고 보존 모드를 켜면 씬과 대사를 대본 그대로 씁니다.']\n      ],\n      useLabel: '이 재료를 쓰는 단계', usedBy: ['s01', 's02', 's03', 's05', 's07', 's08', 's09', 's14'] },\n\n    s01: { phase: 'story', num: '01', code: 's0.5', name: '드라마투르기', gist: '필요한 장소 후보를 끌어냄',\n      does: '이야기가 굴러가려면 어떤 장소들이 필요한지 이야기 안에서 끌어냅니다. 이야기 자체는 고치지 않고 옆에 재료로 둡니다.',\n      items: [\n        ['무대(장소) 후보 목록', '이야기의 핵심 장치가 돌아가는 데 꼭 필요한 장소들입니다. 새로 지어내지 않고 이야기에서 끌어냅니다.'],\n        ['극적 진단', '이야기의 극적 구조를 살핀 메모입니다. 02에서 막을 세울 때 참고합니다.']\n      ],\n      notes: ['후보 가운데 씬이 실제로 쓴 장소만 배경 목록에 들어갑니다. 쓰이지 않은 후보에는 그림 비용이 들지 않습니다.'],\n      receives: ['in'], usedBy: ['s02', 's03'] },\n\n    s02: { phase: 'story', num: '02', code: 's1', name: '서사 구조', gist: '막과 전환점을 세움',\n      does: '이야기의 뼈대를 막 단위로 세웁니다.',\n      items: [\n        ['구조 유형', '3막, 기승전결처럼 이야기를 어떤 틀로 나눌지 정합니다.'],\n        ['막 구성', '막마다 하는 일과, 전체에서 차지하는 비중입니다.'],\n        ['시점', '1인칭, 3인칭처럼 누구의 눈으로 이야기하는지 정합니다.'],\n        ['주제', ''],\n        ['중심 극적 질문', '이야기가 끝까지 붙잡고 가는 질문입니다.'],\n        ['전환점 위치', '이야기가 크게 꺾이는 지점이 전체의 어디쯤인지 정합니다.']\n      ],\n      receives: ['in', 's01'], usedBy: ['s03', 's04', 's06'] },\n\n    s03: { phase: 'story', num: '03', code: 's3', name: '씬 목록', gist: '씬마다 무슨 일이 일어나는지',\n      does: '이야기를 씬으로 나누고, 씬마다 무슨 일이 일어나는지 적습니다.',\n      items: [\n        ['씬별 목적', '이 씬이 이야기에서 맡은 일입니다.'],\n        ['장소·시간대·날씨', ''],\n        ['감정 흐름', '씬 안에서 감정이 어떻게 움직이는지 적습니다.'],\n        ['예상 길이', '초 단위입니다.'],\n        ['행동 비트', '씬 안의 행동을 순서대로 나눈 것입니다. 09에서 샷을 나누는 원재료가 됩니다.'],\n        ['핵심 대사', ''],\n        ['정보 차이', '누가 무엇을 알고, 누가 모르는지 적습니다.']\n      ],\n      notes: ['이야기에 새로 필요한 인물·장소는 기존 목록 뒤에 덧붙입니다. 원래 목록은 바꾸지 않습니다.'],\n      script: '씬 순서·장소·시간·인물·비트·대사는 대본 그대로 쓰고, 대본에 없는 칸(목적·감정·정보 차이·요약)만 채웁니다.',\n      receives: ['in', 's01', 's02'], usedBy: ['s04', 'gate', 's07', 's08', 's09', 's10', 's11', 's12', 's14'] },\n\n    s04: { phase: 'story', num: '04', code: 'c1', name: '이야기 점검', gist: '인과와 차별점 점검', badge: '기본 건너뜀',\n      does: '인과가 무너진 곳과, 처음 의도한 차별점이 사라진 곳을 찾아 보고합니다. 흔한 장르 관습은 감점하지 않습니다.',\n      items: [\n        ['점검 보고서', '인과가 끊긴 곳, 차별점이 사라진 곳, 중심 질문이 살아 있는지를 적습니다.']\n      ],\n      warn: '지금은 기본으로 실행되지 않고, 빈 보고서로 다음으로 넘어갑니다.',\n      receives: ['s02', 's03'], usedBy: [], usedByNote: '뒤 단계가 이 보고서를 읽지는 않습니다.' },\n\n    gate: { phase: 'gate', num: '멈춤', name: '씬 스토리 확정', gist: 'Producer 화면에서 사람이 확인',\n      does: '01~04가 끝나면 Writer가 멈추고 기다립니다. Producer 화면에서 사람이 씬 스토리를 확인하고 확정하면 05부터 이어서 진행됩니다.',\n      itemsQuad: '할 일', itemsTitle: '여기서 할 수 있는 일',\n      items: [\n        ['직접 고치기', '씬 스토리를 손으로 고쳐 저장합니다.'],\n        ['AI 수정안 받기', '고칠 점을 말하면 수정안이 나옵니다. 적용하거나 버릴 수 있습니다.'],\n        ['다시 쓰기', '고치는 정도를 고르면 세 가지 안이 나오고, 하나를 골라 적용합니다. 적용 전으로 되돌릴 수 있습니다.'],\n        ['확정', '확정하면 05부터 15까지 이어서 자동으로 진행됩니다.']\n      ],\n      notes: ['확정 전에는 05 이후 단계가 시작되지 않습니다.'],\n      script: '대본을 보존하는 프로젝트는 씬을 고칠 수 없고, 확정만 할 수 있습니다.',\n      recLabel: '확인하는 것', receives: ['s03', 's04'], useLabel: '확정 후 이어지는 단계', usedBy: ['s05'] },\n\n    s05: { phase: 'look', num: '05', code: 'v0', name: '비주얼 아이덴티티', gist: '작품 전체 그림 스타일',\n      does: '작품 전체에 고정될 그림 스타일을 한 번 정합니다. 뒤의 모든 시각 단계가 이 값을 그대로 물려받습니다.',\n      items: [\n        ['기술 사양', '매체, 화면비, 해상도, 초당 프레임, 그리는 방식입니다.'],\n        ['화풍', ''],\n        ['형태와 선의 느낌', ''],\n        ['인체 비례', ''],\n        ['질감', '']\n      ],\n      notes: ['화면비는 Producer에서 정한 값을 그대로 씁니다.', '그림체 견본을 골랐으면 매체와 화풍은 견본을 따릅니다.'],\n      receives: ['in'], usedBy: ['s06', 's07', 's08', 's11', 's13'] },\n\n    s06: { phase: 'look', num: '06', code: 'v1', name: '막별 비주얼 아크', gist: '막마다 색·빛·에너지 변화',\n      does: '막이 바뀔 때 화면이 어떻게 변하는지 정합니다. 전체 스타일은 그대로 두고 색·빛·에너지만 막마다 움직입니다.',\n      items: [\n        ['막별 색 변화', ''],\n        ['막별 조명 분위기', ''],\n        ['막별 에너지', ''],\n        ['막별 시각 메모', ''],\n        ['전체 변화 의도', '처음부터 끝까지 화면이 어디로 가는지 한 문장으로 적습니다.']\n      ],\n      receives: ['s02', 's05'], usedBy: ['s07', 's08'] },\n\n    s07: { phase: 'look', num: '07', code: 'v2', name: '인물·배경 디자인', gist: '인물 의상과 장소 생김새',\n      does: '인물이 어떻게 생기고 무엇을 입는지, 장소가 어떻게 보이는지 정합니다.',\n      items: [\n        ['인물별 외형·의상', ''],\n        ['작품 색 팔레트', '작품 전체에 쓸 색과, 절대 쓰지 않을 색입니다.'],\n        ['색의 의미', '색마다 무엇을 뜻하는지 적습니다.'],\n        ['장소별 디자인', '장소마다 빛, 스타일, 소품입니다.'],\n        ['특수효과 방향', '']\n      ],\n      after: ['작품 스타일과 팔레트가 디자인 기준값으로 저장됩니다.', '인물·배경·씬 목록이 프로젝트에 기록됩니다.', 'Artist의 인물 시트·배경 그림 생성이 자동으로 시작됩니다.'],\n      receives: ['in', 's03', 's05', 's06'], usedBy: ['s08', 's09', 's10', 's11', 's12', 's13', ['out', 'Artist 인물 시트·배경 그림']] },\n\n    s08: { phase: 'scene', num: '08', code: 'v3', name: '씬 촬영계획', gist: '씬을 어떻게 찍을지',\n      does: '씬마다 이 장면을 어떻게 찍을지 큰 방침을 정합니다. 뒤의 샷 단계는 이 방침 안에서만 움직입니다.',\n      items: [\n        ['목표 샷 수', ''],\n        ['평균 샷 길이·컷 템포', '화면이 촘촘한 그림체일수록 샷을 길게 잡습니다.'],\n        ['렌즈·카메라 장비', ''],\n        ['카메라 에너지', ''],\n        ['조명 변화', '씬 처음부터 끝까지 빛의 색온도가 어떻게 바뀌는지 정합니다.'],\n        ['강조 색', ''],\n        ['180° 축', '대화 씬에서 카메라가 넘지 않는 선입니다.'],\n        ['주 시점 인물', ''],\n        ['찍는 방식(커버리지)', '어떤 각도들로 장면을 덮을지 정합니다.']\n      ],\n      notes: ['씬마다 행동 수를 세어 권장 샷 수도 함께 계산합니다. 한 샷에 안 담기는 씬은 미리 표시해 둡니다.', '규칙에 어긋난 계획은 한 번 고쳐서 다시 만듭니다.'],\n      receives: ['in', 's03', 's05', 's06', 's07'], usedBy: ['s09', 's10', 's11', 's12'] },\n\n    s09: { phase: 'scene', num: '09', code: 'decoupage', name: '샷 나누기', sub: '데쿠파주', gist: '행동 비트를 샷으로 분해',\n      does: '감독처럼 씬의 행동 비트를 샷으로 나눕니다. 샷 개수는 시간 계산이 아니라 연출 판단으로 정해집니다.',\n      items: [\n        ['씬별 샷 목록', '비트 하나를 샷 하나로 옮기거나, 없던 샷을 더하거나, 여러 비트를 합치거나, 한 비트를 쪼갭니다.'],\n        ['샷 크기', '와이드에서 클로즈업까지입니다.'],\n        ['샷 길이', ''],\n        ['리듬 역할과 극적 목적', ''],\n        ['카메라 의도와 움직일 이유', '']\n      ],\n      notes: ['카메라는 강조·감정·드러내기·에너지·시점 가운데 이유가 있을 때만 움직이고, 이유가 없으면 고정합니다.'],\n      receives: ['in', 's03', 's07', 's08'], usedBy: ['s10', 's11', 's12', 's14'] },\n\n    s10: { phase: 'scene', num: '10', code: 'stage', name: '씬 무대', gist: '인물이 설 자리 배치도',\n      does: '씬마다 위에서 내려다본 배치도를 세웁니다. 이 배치도로 샷의 화면 안 위치를 계산해서, 인물이 컷마다 좌우로 뒤집히지 않게 합니다.',\n      items: [\n        ['지형·소품 위치', ''],\n        ['비트별 인물 위치·방향·자세', ''],\n        ['180° 축과 카메라가 머무는 쪽', '']\n      ],\n      receives: ['s03', 's07', 's08', 's09'], usedBy: ['s11'] },\n\n    s11: { phase: 'shot', num: '11', code: 'v4', name: '샷 설계', gist: '샷마다 화면과 움직임 스펙',\n      does: '샷 하나하나에 세부 스펙을 붙입니다. 의도, 멈춘 화면, 움직임의 세 덩어리로 나뉩니다.',\n      items: [\n        ['의도', '왜 이 샷인지, 길이를 이렇게 잡은 까닭, 관객이 볼 곳입니다.'],\n        ['멈춘 화면', '렌즈·앵글·심도·프레이밍·조명·인물 배치·소품·색·질감, 그리고 첫 프레임 문장입니다.'],\n        ['움직임', '카메라 움직임·인물 동작·시선·환경 변화·전환, 그리고 영상 문장입니다.'],\n        ['인물 상태 장부', '자세나 위치가 바뀌는 순간을 어느 샷이 보여주는지 적습니다.']\n      ],\n      notes: ['첫 프레임 문장과 영상 문장이 그대로 그림·영상 생성에 쓰입니다.', '화면 안 위치는 10의 배치도에서 계산합니다.'],\n      receives: ['s03', 's05', 's07', 's08', 's09', 's10'], usedBy: ['s12'] },\n\n    s12: { phase: 'shot', num: '12', code: 'c2', name: '샷 검수', gist: '문제를 고르고 샷을 쪼갬',\n      does: '샷 전체를 한 번에 읽고 문제를 고릅니다. 한 샷에 다 안 담기는 장면은 둘 이상으로 쪼갭니다.',\n      items: [\n        ['쪼갠 샷', ''],\n        ['그림 제약', '화면에서 고칠 수 있는 문제를 해당 샷에 붙인 문장입니다. 러프·실사 그림을 만들 때 실립니다.'],\n        ['검수 보고서', '치명적인 문제가 하나라도 있으면 불합격으로 표시합니다.'],\n        ['최종 샷 번호', '']\n      ],\n      receives: ['s03', 's07', 's08', 's09', 's11'], usedBy: ['s13', 's15'] },\n\n    s13: { phase: 'shot', num: '13', code: 'v5', name: '생성용 문장 정리', gist: '그림·영상 생성 재료 묶음',\n      does: '샷마다 그림·영상 생성에 넣을 재료를 한 묶음으로 정리합니다. 문장이 이미 있으면 그대로 옮기고, 비어 있을 때만 새로 씁니다.',\n      items: [\n        ['이미지 문장', ''],\n        ['영상 문장', ''],\n        ['화면비·해상도·초당 프레임', ''],\n        ['참조할 인물·배경', '']\n      ],\n      notes: ['이 묶음은 Writer 결과 내보내기에 실립니다. Director는 15에서 저장한 샷 표의 문장을 읽습니다.'],\n      receives: ['s05', 's07', 's12'], usedBy: [['', 'Writer 결과 내보내기']] },\n\n    s14: { phase: 'shot', num: '14', code: 'dialogue', name: '대사', gist: '말투를 정하고 샷별 대사를 씁니다 · 11~13과 동시에',\n      does: '인물별 말투를 먼저 정하고, 씬 순서대로 샷마다 대사를 씁니다. 앞 씬에서 확정된 사실과 관계를 기억하며 이어 씁니다.',\n      items: [\n        ['인물별 말투', '인물마다 어투를 먼저 정해 대사가 흔들리지 않게 합니다.'],\n        ['샷별 대사', '']\n      ],\n      notes: ['말 없는 순간을 남기고, 정보는 정해진 순서대로만 드러내고, 명대사를 억지로 만들지 않습니다.', '한 씬의 대사 작성이 실패해도 그 씬만 대사 없이 넘어가고, 나머지는 계속됩니다.'],\n      script: '새로 쓰지 않고 대본의 대사를 그대로 샷에 싣습니다.',\n      receives: ['in', 's03', 's09'], usedBy: ['s15'] },\n\n    s15: { phase: 'save', num: '15', code: 'persist', name: '샷 저장', gist: '샷 표로 기록',\n      does: '그림 갈래와 대사 갈래의 결과를 합쳐, 샷 표에 샷 하나당 한 줄씩 기록합니다.',\n      items: [\n        ['생성 문장', '첫 프레임 문장과 영상 문장입니다.'],\n        ['멈춘 화면·움직임 스펙', ''],\n        ['그림 제약', ''],\n        ['길이', ''],\n        ['대사 줄', '']\n      ],\n      notes: ['사람이 직접 고친 칸은 덮어쓰지 않습니다.'],\n      receives: ['s12', 's14'], usedBy: [['out', '러프 스토리보드'], ['out', 'Director 실사'], ['out', 'Editor 편집']] },\n\n    out: { phase: 'out', num: '바깥', name: 'Writer 다음', gist: '샷 표를 읽어 그림·영상으로',\n      does: '샷 표가 저장되면 다른 화면들이 이 내용을 읽어 그림과 영상을 만듭니다.',\n      itemsQuad: '하류', itemsTitle: '그다음 만들어지는 것',\n      items: [\n        ['러프 스토리보드', '샷마다 시작·연출·끝 세 장입니다. Writer 화면이 열려 있을 때 그립니다.'],\n        ['인물 시트·배경 그림 (Artist)', '07이 끝나면 자동으로 시작됩니다.'],\n        ['실사 스틸·영상 (Director)', '러프 스토리보드, 인물 시트, 배경 그림을 참조해 만듭니다.'],\n        ['편집 (Editor)', '만든 영상을 샷 순서대로 이어 붙이고, Writer 대사로 자막 초안을 채웁니다.']\n      ],\n      recLabel: '읽는 것', receives: ['s07', 's15'], usedBy: [] }\n  };\n\n\n\n  // ───────── Producer (기존): P1 기초 세팅 → P2 Producer 화면 · 실제 화면 2026-10-12 기준 ─────────\n  var PN = {\n    p1: { phase: 'prod', num: 'P1', code: '기초 세팅', name: '기초 세팅', gist: 'Producer에 들어가기 전',\n      does: '새 프로젝트 화면입니다. 1 자료·아이디어 → 2 쓰임새 → 3 길이·화면 순서로 진행하고, \"Producer로 시작하기\"를 누르면 Producer 화면으로 들어갑니다.',\n      itemsQuad: '화면', itemsTitle: '여기서 정하는 것',\n      items: [\n        ['아이디어', '\"예) 초등학교 운동장에서…\" 입력칸에 한 줄 아이디어를 적습니다.'],\n        ['파일 첨부', '스토리·대본·기획 메모·인물·배경 이미지. 이미지는 올리기 전에 사용 권한 확인을 거칩니다. 참고 작품은 Producer10 이상 요금제입니다.'],\n        ['쓰임새', '파일을 올렸을 때만 나옵니다. 글 파일은 대본 그대로 / 대본 다듬어서 / 아이디어·메모 중에서 고릅니다. \"대본 그대로\"가 대본 보존 모드입니다.'],\n        ['길이·화면', '\"무엇을 만들고 싶으세요?\" 단편 영화 / 드라마 파일럿 / 광고·브랜드 / 원작 영상화 / 뮤직비디오 / 직접 적을게요. 고른 것에 맞춰 화면 비율과 러닝타임을 먼저 채웁니다.']\n      ],\n      notes: ['이미지 쓰임새는 확인하지 못했습니다(사용 권한 동의 단계에서 멈춤). 아키텍처 지도 04 기준으로 인물 이미지는 캐스트, 스타일 이미지는 스타일 앵커로 등록됩니다.'\n      ],\n      receives: [], usedBy: ['p2'] },\n    p2: { phase: 'prod', num: 'P2', code: 'Producer 화면', name: 'Producer 화면', gist: 'Meeting Room · 채팅으로 채움',\n      does: 'Producer 화면(Meeting Room)입니다. 에이전트 채팅으로 이야기를 나누면 설정 칩, Casting, Background가 채워지고, Writer 01~04가 쓴 씬 스토리가 아래에 나타납니다. \"Writer로 넘기기\"를 누르면 씬 스토리가 확정됩니다.',\n      itemsQuad: '화면', itemsTitle: '화면에 있는 것',\n      items: [\n        ['제작 여정', '이야기 씨앗 → 설정 확정 → 주인공 등장 → 무대 완성 → Writer 호출'],\n        ['설정 칩 (제목 아래)', '러닝타임 · 장르 · 스타일 · 포맷(화면비) · 톤 · 대사 언어 · 채팅 언어'],\n        ['Casting · Background', '인물 카드, 배경 카드 (준비됨 n / 전체 n)'],\n        ['씬 스토리', 'Writer 01~04의 결과입니다. 복사 / 직접 고치기 / 다시 쓰기(조금만 다듬기 · 표현을 새로 · 아이디어부터 다시 · 직접 입력)'],\n        ['에이전트 채팅', 'AI Producer. 기본 Claude Sonnet, 다른 모델을 고를 수 있습니다.']\n      ],\n      warn: 'Writer로 넘길 때 \"트리트먼트를 쓴 뒤 러닝타임이 바뀌었어요\"로 넘기기가 막힌 적이 있습니다(10/5). 설정 칩과 씬 스토리가 따로 움직여서 생기는 문제입니다.', warnLabel: '알려진 문제',\n      receives: ['p1'], usedBy: ['s01', 'gate'] }\n  };\n  Object.keys(PN).forEach(function (k) { N[k] = PN[k]; });\n  N.tow = { phase: 'tow', num: '바깥', name: 'Writer로 이어짐', gist: '씬 확정 뒤 이어서 진행',\n    does: 'Producer 화면에서 씬 스토리를 확정하면 Writer가 05부터 15까지 이어서 진행합니다. 07이 끝나면 Artist 인물 시트·배경 그림도 자동으로 시작됩니다.',\n    itemsQuad: '하류', itemsTitle: '그다음 만들어지는 것',\n    items: [\n      ['05~07 보이는 모습', '그림 스타일, 막별 색·빛, 인물·배경 디자인입니다.'],\n      ['08~15 씬·샷 설계와 저장', '촬영계획, 샷 나누기, 샷 설계, 대사, 샷 표 저장입니다.'],\n      ['Artist 인물 시트·배경', '07이 끝나면 자동으로 시작됩니다.']\n    ],\n    recLabel: '이어지는 곳', receives: ['gate'], usedBy: [] };\n\n\n  // ───────── 제안(A안): P1 기초 세팅 → P2 Producer 화면 (산문만) ─────────\n  var QN = {\n    q1: { phase: 'prod', num: 'P1', code: '기초 세팅', name: '기초 세팅', gist: '산문 조건 + 언어·비율 잠금', badge: '바뀜',\n      does: 'Producer에 들어가기 전 화면입니다. 자료·아이디어를 넣고, 에이전트가 미리 채운 시작 세팅을 확인합니다. 작업 언어와 화면 비율은 여기서 잠기고, 장르·톤과 길이, AI 개입 정도는 모두 산문을 쓰기 위한 조건입니다.',\n      itemsQuad: '화면', itemsTitle: '여기서 정하는 것',\n      items: [\n        ['자료·아이디어 + AI 개입 정도', '최대한 그대로(= 대본 보존) / 조금만 다듬기 / 아이디어부터 키우기. 산문용입니다.'],\n        ['작업 언어 🔒 · 화면 비율 🔒', '시작하면 잠깁니다.'],\n        ['장르·톤 (산문용)', '산문에만 영향을 줍니다. 그림용 장르·톤은 Artist에서 따로 정합니다.'],\n        ['길이 (산문용)', '범위로 고릅니다.']\n      ],\n      notes: ['\"무엇을 만들고 싶으세요\", 스타일, 대사 언어, 인물·배경은 여기서 묻지 않습니다.'],\n      receives: [], usedBy: ['q2'] },\n    q2: { phase: 'prod', num: 'P2', code: 'Producer 화면', name: 'Producer 화면', gist: '산문 쓰기 · 다시 쓰기 · 확정', badge: '바뀜',\n      does: 'Producer 화면은 산문만 다룹니다. 산문(씬 스토리)을 보고, 다시 쓰기 카드로 고칩니다. 장르·톤, 길이, AI 개입 정도는 따로 된 설정 칩이 아니라 다시 쓰기의 조건입니다. \"산문 확정 · 넘기기\"를 누르면 Producer가 잠기고, 산문 조건의 영향은 여기서 끊깁니다.',\n      itemsQuad: '화면', itemsTitle: '화면에 있는 것',\n      items: [\n        ['씬 스토리 (산문)', '산문 머리에 예상 러닝타임과 장르만 보여 줍니다.'],\n        ['다시 쓰기 조건', '얼마나(AI 개입 정도) / 길이 / 장르·톤 → 세 가지 안 → 적용·되돌리기'],\n        ['산문 확정 · 넘기기', 'Producer 잠금. 러닝타임 일치 검사는 없앱니다.']\n      ],\n      notes: ['빠지는 것: 제목 아래 설정 칩, Casting · Background(→ Artist), 스타일(→ Artist), 대사 언어(→ Writer).'],\n      warn: '지금은 이 산문을 Writer 01~04가 씁니다. 제안에서는 01~04가 보이는 모습 뒤로 가므로, Producer 산문을 무엇이 쓸지와 넘기기 검사를 빼도 되는지 개발 확인이 필요합니다.', warnLabel: '개발 확인',\n      receives: ['q1'], usedBy: ['gate'] }\n  };\n  Object.keys(QN).forEach(function (k) { N[k] = QN[k]; });\n  // Artist 첫 단계 (A안)\n  N.v0 = { phase: 'look', num: 'A0', code: 'Artist', name: '인물·배경·스타일', gist: '스타일·비주얼 장르를 정하고 그림부터', badge: '새로',\n    does: 'Artist의 시작입니다. 확정 산문에서 뽑은 인물·배경 목록을 보여주고, 스타일을 정해 잠급니다. 장르·톤은 이미지 객체마다 따로 줄 수 있습니다. 07에서 인물 시트·배경 그림을 만들고 Director까지 이어집니다.',\n    items: [\n      ['인물·배경 목록', '확정된 산문에서 뽑습니다. 직접 더할 수 있습니다.'],\n      ['스타일 🔒', '여기서 정하면 잠깁니다. Artist에서든 Director에서든 바꾸면 리셋되고, 시트·배경·실사를 다시 만듭니다.'],\n      ['장르·톤 (객체마다)', '인물·배경·씬 이미지 하나하나에 따로 적용합니다. 예: 스타일은 애니인데 이 인물만 호러, 이 씬만 코미디. 부모·자식으로 물려받지 않습니다.']\n    ],\n    warn: '스타일을 잠그고 바꿀 때 리셋하는 방식, 장르·톤을 이미지 객체마다 저장할 수 있는지 개발 확인이 필요합니다.', warnLabel: '개발 확인',\n    receives: ['gate'], usedBy: ['s05', 's06', 's07'] };\n  // A안에서 Writer 단계 상세에 붙는 메모\n  var PROP_NOTES = {\n    gate: 'A안: Producer P2의 \"산문 확정 · 넘기기\"예요. Producer가 잠기고, 산문 조건(장르·톤, 길이, AI 개입 정도)은 여기서 끊겨요. 여기서 두 갈래로 나뉘어요: Artist 보이는 모습(그림) / Writer 샷 나누기·러프.',\n    s05: 'A안: Artist 단계예요. A0에서 정한 스타일로 작품 전체 그림 스타일(비주얼 아이덴티티)을 정하고 잠가요. 바꾸면 리셋돼요.',\n    s06: 'A안: Artist 단계예요. 막별 색·빛은 잠긴 스타일 안에서만 움직여요. 장르·톤은 막 전체가 아니라 객체마다 따로 줘요. 지금은 02 막 구성을 받아 쓰기 때문에 개발 확인이 필요해요.',\n    s07: 'A안: Artist 단계예요. 인물 시트와 배경 그림을 만들어요. 인물·배경마다 장르·톤을 따로 줄 수 있어요(이 인물만 호러). 목록은 Writer 샷 나누기·러프에 목록으로만 들어가고, 그림은 Director로 가요.',\n    s01: 'A안: Writer 단계예요. 확정 산문을 받아 샷을 나눌 준비를 해요. 01~04 → 08~10 → 11~14로 이어져 러프를 만들어요. Artist의 그림은 받지 않아요.',\n    s02: 'A안: Writer 단계예요. 산문 조건을 다시 읽지 않고, 확정 산문의 구조를 따라요.',\n    s03: 'A안: Writer 단계예요. 러닝타임 입력을 다시 읽지 않고 확정 산문의 씬 길이를 따라요. 총 러닝타임은 샷 길이의 합으로 화면에 보여주기만 해요.',\n    s04: 'A안: Writer 단계의 점검이에요.',\n    s08: 'A안: 러닝타임 입력 없이 씬 길이로 샷 수와 템포를 정해요. Artist의 그림 정보(05·06)는 받지 않고 인물·배경 목록만 받아요(지금 코드는 05·06도 받음 → 개발 확인).',\n    s09: 'A안: Writer 샷 나누기예요. 샷 설정(카메라 앵글·샷 크기)을 여기서 다루고, 샷 길이의 합이 총 러닝타임으로 보여요. 인물·배경은 목록으로만 받아요.',\n    s11: 'A안: 샷 설계는 그림 스타일을 받지 않아요(지금 코드는 05를 받음 → 개발 확인). 샷 설정(앵글 등)을 받아요. 그림은 Director에서 시트·배경과 합쳐져요.',\n    s14: 'A안: 대사 언어는 Writer 옵션에서 바꿔요. 대사마다 따로 한/영을 골라 섞을 수 있고, 바꾸면 그 대사만 다시 써요.',\n    s15: 'A안: 저장된 샷 표로 Writer가 러프 스토리보드를 그려요.',\n    out: 'A안: 스타일은 Artist에서 잠겨 있어요. Director에서 바꾸려 하면 리셋돼서 Artist부터 다시 만들어요. 장르·톤은 씬·샷 이미지마다 따로 줄 수 있어요(이 씬만 코미디). Director와 Artist는 서로 영향을 주고받아요.'\n  };\n  var PH_PROP = {\n    story: { label: 'Writer · 이야기 짜기', nav: 'Writer 이야기 짜기', hint: '확정 산문 → 샷 나누기(앵글·러닝타임) → 러프' },\n    gate:  { label: '산문 확정 · 넘기기', nav: '산문 확정' },\n    look:  { label: 'Artist · 보이는 모습', nav: 'Artist 보이는 모습', hint: '비주얼 아이덴티티 · 시트 · 배경 → Director' }\n  };\n  function ph(k) { if (TRACK_VER === 'prop' && PH_PROP[k]) { var o = der class=\"hero\">\u003cdiv class=\"wrap\">\n    \u003cdiv class=\"hero-top\">\u003cdiv>\u003cdiv class=\"eyebrow\">Development architecture atlas\u003c/div>\u003ch1>Tale Studio\u003cbr>제작 파이프라인 지도\u003c/h1>\u003cp>입력 영향, 동작 분기, 실제 화면 기능별 생성 모델을 탭으로 탐색하세요.\u003c/p>\u003c/div>\u003cdiv class=\"snapshot\">\u003cstrong>분석 스냅샷\u003c/strong>Git bundle · dev 브랜치\u003cbr>커밋 cb7ed81c · 2026.09.29\u003cbr>정적 코드 분석 · 실행 통계 아님\u003c/div>\u003c/div>\n    \u003cdiv class=\"hero-stats\">\u003cdiv class=\"stat\">\u003cb>5\u003c/b>\u003cspan>분석·기획 탭\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cb>5\u003c/b>\u003cspan>단계별 로직\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cb>5\u003c/b>\u003cspan>제작 단계\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cb>실제 UI\u003c/b>\u003cspan>기능별 모델 지도\u003c/span>\u003c/div>\u003c/div>\n  \u003c/div>\u003c/header>\n  \u003cnav class=\"topnav\" aria-label=\"분석 탭\">\u003cdiv class=\"wrap navrow\" id=\"analysisTabs\" role=\"tablist\" aria-label=\"분석 화면\">\u003cbutton type=\"button\" role=\"tab\" data-section=\"api-map\" aria-controls=\"api-map\">01 · 생성 모델 지도\u003c/button>\u003cbutton type=\"button\" role=\"tab\" data-section=\"impact\" aria-controls=\"impact\">02 · 입력 영향도\u003c/button>\u003cbutton type=\"button\" role=\"tab\" data-section=\"flow\" aria-controls=\"flow\">03 · 동작 로직\u003c/button>\u003cbutton type=\"button\" role=\"tab\" data-section=\"journey\" aria-controls=\"journey\">04 · Persona 유저 저니\u003c/button>\u003cbutton type=\"button\" role=\"tab\" data-section=\"qa\" aria-controls=\"qa\">05 · 미정 (TBD)\u003c/button>\u003c/div>\u003c/nav>\n  \u003cmain class=\"wrap\">\u003cdiv class=\"version-bar\">\u003cdiv class=\"version-main\">\u003cb>Tale Studio · 코드 기준 2026.09.29 13:21 KST\u003c/b>\u003ccode>dev / cb7ed81c\u003c/code>\u003cspan>번들 2026.10.07 · HTML 수정 2026.10.08\u003c/span>\u003c/div>\u003cdiv class=\"version-actions\">\u003cbutton type=\"button\" id=\"sourceVersion\">소스·버전 상세\u003c/button>\u003cbutton type=\"button\" id=\"readingGuide\">지도 읽는 법\u003c/button>\u003c/div>\u003c/div>\n    \u003csection class=\"section\" id=\"api-map\" role=\"tabpanel\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"section-kicker\">01 / Stage × function × model\u003c/div>\u003ch2>생성 모델 지도\u003c/h2>\u003cp>전체 모델을 누르면 사용 기능이, 기능을 누르면 기본·선택 모델과 입출력이 연결됩니다.\u003c/p>\u003c/div>\u003cspan class=\"scope-badge\">현재 코드\u003c/span>\u003c/div>\u003cdiv class=\"atlas\">\u003cdiv class=\"atlas-toolbar\">\u003cstrong>단계 × 화면 기능\u003c/strong>\u003cdiv class=\"model-filters\" id=\"modelFilters\" aria-label=\"모델 종류 필터\">\u003c/div>\u003c/div>\u003cdiv class=\"model-grid\" id=\"modelGrid\">\u003c/div>\u003cdiv class=\"map-legend\">\u003cspan>매트릭스 = 대표 기본값 · 아래 전체 모델 클릭으로 연결 기능 확인\u003c/span>\u003cbutton type=\"button\" class=\"atlas-note-link\" id=\"activePathNote\">Previz·V2 예외\u003c/button>\u003c/div>\u003cdiv id=\"modelRoute\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003c/section>\n    \u003csection class=\"section\" id=\"impact\" role=\"tabpanel\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"section-kicker\">02 / Output becomes input\u003c/div>\u003ch2>입력값 영향도 그래프\u003c/h2>\u003cp>노드 → 연결 대상 선택. 선을 타고 넘어가는 정보와 받는 곳의 사용 목적을 확인하세요.\u003c/p>\u003c/div>\u003cdiv class=\"section-action\">\u003cbutton class=\"ghost-btn\" id=\"impactReset\">선택 해제\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"diagram-shell\">\u003cdiv class=\"diagram-tools\">\u003cstrong>원천 입력 → 생성 산출물 → 편집\u003c/strong>\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"legend-line\">\u003c/i> 다음 생성 시 참조\u003c/span>\u003cspan>\u003ci class=\"legend-line dashed\">\u003c/i> 기존 결과는 재생성 필요\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"diagram-scroll\" id=\"impactScroll\">\u003cdiv class=\"diagram-board\" id=\"impactBoard\" style=\"width:1330px;height:710px\">\u003c/div>\u003c/div>\u003cdiv class=\"diagram-detail\" id=\"impactDetail\">\u003c/div>\u003c/div>\u003cp class=\"quiet-note\">입력 변경만으로 기존 이미지·영상이 자동 교체되지는 않습니다.\u003c/p>\u003c/section>\n    \u003csection class=\"section\" id=\"flow\" role=\"tabpanel\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"section-kicker\">03 / Five-stage behavior flow\u003c/div>\u003ch2>동작 로직 플로우차트\u003c/h2>\u003cp>입력 → 실행 → 판정 → 산출물. 단계를 선택하면 전환·수정 조건을 확인합니다.\u003c/p>\u003c/div>\u003c/div>\u003cdiv class=\"atlas logic-atlas\">\u003cdiv class=\"atlas-toolbar\">\u003cspan class=\"scope-badge\">현재 코드\u003c/span>\u003cspan class=\"atlas-note\">열린 단계 재방문 가능 · Producer 잠금은 04의 목표 정책\u003c/span>\u003c/div>\u003cdiv class=\"logic-grid\" id=\"flowOverview\">\u003c/div>\u003cdiv id=\"logicDetail\" aria-live=\"polite\">\u003c/div>\u003cp class=\"quiet-note\">UI와 Crew는 각각 실행 진입점입니다. 일부 승인·이동은 LLM 전에 처리합니다.\u003c/p>\u003c/div>\u003c/section>\n    \u003csection class=\"section\" id=\"journey\" role=\"tabpanel\">\n      \u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"section-kicker\">04 / People & journeys\u003c/div>\u003ch2>Persona별 유저 저니\u003c/h2>\u003cp>A는 가져온 자료에서 동료 인계까지, B는 아이디어에서 전체 결과까지.\u003c/p>\u003c/div>\u003cspan class=\"scope-badge proposed\">목표 UX · 기획 초안\u003c/span>\u003c/div>\n      \u003cdiv class=\"persona-select\" id=\"personaChoices\" aria-label=\"이용 유형\">\u003c/div>\n      \u003cdiv class=\"journey-role-rail\" id=\"journeyRoles\" aria-label=\"직원 업무 선택\">\u003c/div>\n      \u003cdiv class=\"atlas journey-atlas\">\n        \u003cdiv class=\"journey-toolbar\">\u003cdiv id=\"journeyTitle\">\u003c/div>\u003cdiv class=\"journey-presets\" id=\"journeyPresets\" aria-label=\"업무별 입력 시나리오\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"journey-stage-rail\" id=\"journeyStages\" aria-label=\"이 업무의 제작 단계\">\u003c/div>\n        \u003cdiv class=\"journey-policy\" id=\"journeyPolicy\">\u003c/div>\n        \u003cdiv class=\"journey-map-scroll\">\u003cdiv class=\"journey-map\" id=\"journeyMap\" aria-label=\"업무 요청부터 승인·수정·인계까지\">\u003c/div>\u003c/div>\n        \u003cdiv class=\"journey-focus\" id=\"journeyFocus\" aria-live=\"polite\">\u003c/div>\n        \u003cdiv class=\"journey-bottom\">\u003cspan>노드 클릭 → 사람·서비스·완료 기준\u003c/span>\u003cbutton type=\"button\" class=\"atlas-note-link\" id=\"journeyNotes\">마찰·예외·설계 메모\u003c/button>\u003cbutton type=\"button\" class=\"atlas-note-link\" id=\"personaCompare\">A/B 비교\u003c/button>\u003cbutton type=\"button\" class=\"atlas-note-link\" id=\"producerPolicy\">잠금 정책\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"quiet-note\">업무·승인자·인계는 대표 시나리오 가설입니다. 팀 권한과 자동화 구현 범위는 별도 설계합니다.\u003c/p>\n    \u003c/section>\n    \u003csection class=\"section\" id=\"qa\" role=\"tabpanel\">\u003cdiv class=\"section-head\">\u003cdiv>\u003cdiv class=\"section-kicker\">05 / TBD · work in progress\u003c/div>\u003ch2>미정 · TBD\u003c/h2>\u003cp>다음에 정의할 정책과 예외 흐름입니다.\u003c/p>\u003c/div>\u003cspan class=\"scope-badge tbd\">범위·구조 재설계 예정\u003c/span>\u003c/div>\u003cdiv class=\"tbd-topics\">\u003carticle>\u003cspan>01\u003c/span>\u003ch3>기획 확정·잠금\u003c/h3>\u003cp>잠금 항목 · 확정 권한 · 변경 예외\u003c/p>\u003c/article>\u003carticle>\u003cspan>02\u003c/span>\u003ch3>업무 합류·인계\u003c/h3>\u003cp>담당 범위 · 승인자 · 결과 버전\u003c/p>\u003c/article>\u003carticle>\u003cspan>03\u003c/span>\u003ch3>수정·실행 상태\u003c/h3>\u003cp>영향 범위 · 진행 중 작업 · 실패·재개\u003c/p>\u003c/article>\u003c/div>\u003cdetails id=\"qaDraft\" class=\"qa-draft\">\u003csummary>기존 전환·실행 QA 초안 \u003cspan>8개 시나리오 · 펼쳐보기\u003c/span>\u003c/summary>\u003cdiv class=\"atlas\">\u003cdiv class=\"atlas-toolbar\">\u003cstrong>참고 초안 · 현재 코드의 전환·실행 QA\u003c/strong>\u003cspan class=\"atlas-note\">정적 검토 · 실제 재현 전\u003c/span>\u003c/div>\u003cdiv class=\"qa-state-strip\">\u003cdiv>\u003cb>① 같은 프로젝트인가\u003c/b>요청과 화면이 같은 프로젝트인지\u003csmall>projectId · 대상 인물/씬/샷 ID\u003c/small>\u003c/div>\u003cdiv>\u003cb>② 지금 어디를 보고 있나\u003c/b>주소·선택 탭·Crew가 맞는지\u003csmall>URL ↔ currentStage\u003c/small>\u003c/div>\u003cdiv>\u003cb>③ 어디까지 열려 있나\u003c/b>뒤로 가도 열린 단계는 유지하는지\u003csmall>reachedStage ↔ DB current_stage\u003c/small>\u003c/div>\u003cdiv>\u003cb>④ 어떤 작업이 남았나\u003c/b>승인 대기·생성 중·완료를 구별\u003csmall>proposal · run · job · 화면 반영\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"qa-stage-rail\" id=\"qaStageRail\" aria-label=\"QA 단계 필터\">\u003c/div>\u003cdiv class=\"qa-rail-note\">\u003cspan>현재 코드: 열린 단계 재방문 허용 · 목표 정책: Producer 확정 후 복귀 금지 (04)\u003c/span>\u003cspan>단계를 누르면 관련 증상만 표시\u003c/span>\u003c/div>\u003cdiv class=\"qa-layout\">\u003caside class=\"qa-menu\">\u003ch3>증상 선택\u003c/h3>\u003cdiv class=\"qa-cases\" id=\"qaCases\">\u003c/div>\u003c/aside>\u003cdiv class=\"qa-content\">\u003cdiv class=\"qa-checkpoints\" id=\"qaCheckpoints\" aria-label=\"실행 상태 확인 위치\">\u003c/div>\u003cdiv class=\"qa-graph-key\">주황색 = 이 증상에서 먼저 볼 구간 · 각 구간을 누르면 설명\u003c/div>\u003cdiv id=\"qaDetail\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"qa-note\">\u003cb>접수 ≠ 완료 ≠ 화면 반영.\u003c/b> 채팅 Stop은 진행 중 LLM 응답을 중단하며 이미 제출된 서버 생성의 취소를 보장하지 않습니다. 이전 단계로 돌아가는 것만으로 생성·수정이 실행되지는 않습니다.\u003c/div>\u003c/div>\u003c/details>\u003c/section>\n  \u003c/main>\n  \u003cfooter class=\"footer\">\u003cdiv class=\"wrap\">Tale Studio 코드 구조 · dev / cb7ed81c · 코드 2026-09-29 13:21 KST · 번들 2026-10-07 · HTML 수정 2026-10-08. \u003ca href=\"./코드-구조-분석.md\">분석 설명\u003c/a>\u003cbr>로컬 정적 HTML입니다. 데이터는 번들 소스 스냅샷이며 운영 트래픽·비용·현재 배포 상태를 의미하지 않습니다.\u003c/div>\u003c/footer>\n  \u003cdiv class=\"drawer-backdrop\" id=\"drawerBackdrop\" role=\"presentation\">\u003caside class=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"drawerTitle\">\u003cbutton class=\"drawer-close\" id=\"drawerClose\" aria-label=\"닫기\">×\u003c/button>\u003cdiv id=\"drawerBody\">\u003c/div>\u003c/aside>\u003c/div>\n  \u003cscript>\n    const ROUTES = [{\"group\":\"admin\",\"method\":\"GET\",\"endpoint\":\"/api/admin/billing\",\"file\":\"src/app/api/admin/billing/route.ts\",\"line\":36},{\"group\":\"admin\",\"method\":\"POST\",\"endpoint\":\"/api/admin/billing\",\"file\":\"src/app/api/admin/billing/route.ts\",\"line\":71},{\"group\":\"artist\",\"method\":\"POST\",\"
